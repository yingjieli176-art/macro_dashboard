name: Diagnose live Streamlit release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - static/deploy_version.json
      - .github/workflows/deployment-sync.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Detect live deployment status, redirect and release
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          expected = json.loads(pathlib.Path("static/deploy_version.json").read_text())["release"]
          base = "https://data-macromarket.streamlit.app"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          responses = {}
          for path in ("/", "/_stcore/health", "/app/static/deploy_version.json"):
              url = base + path
              req = urllib.request.Request(
                  url, headers={"User-Agent": "MacroDashboard-release-diagnostic/1.1"}
              )
              try:
                  with opener.open(req, timeout=15) as result:
                      status = result.status
                      location = result.headers.get("Location")
                      body = result.read(20000)
              except urllib.error.HTTPError as error:
                  status = error.code
                  location = error.headers.get("Location")
                  body = error.read(20000)
              except Exception as error:
                  print(f"PATH {path}: network_error={type(error).__name__}: {error}", flush=True)
                  responses[path] = (None, None, None)
                  continue
              if location:
                  parsed = urllib.parse.urlsplit(location)
                  location = f"{parsed.scheme}://{parsed.hostname}{parsed.path}" if parsed.scheme else parsed.path
              print(f"PATH {path}: status={status}; redirect={location or '-'}; type={len(body)} bytes", flush=True)
              responses[path] = (status, location, body)

          status, _, body = responses.get("/app/static/deploy_version.json", (None, None, None))
          if status == 200 and body:
              try:
                  release = json.loads(body).get("release")
              except (ValueError, AttributeError):
                  release = None
              print(f"VERSION: github={expected}, live={release or 'not-json'}", flush=True)
              if release == expected:
                  print("PASS: deployed version matches repository")
                  sys.exit(0)
              if release:
                  sys.exit("FAIL: deployed old release; verify Streamlit Cloud branch and reboot")
          if status in (301, 302, 303, 307, 308):
              sys.exit("INCONCLUSIVE: Cloud returns a redirect to release probe; check URL access policy, Streamlit logs and deployed branch")
          sys.exit("INCONCLUSIVE: live release could not be verified; check Streamlit Cloud deployment logs")
          PY
