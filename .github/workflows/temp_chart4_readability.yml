name: temp-chart4-readability
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart 4
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def build_fig4(')
          end = s.index('\ndef ', start + 5)
          new = '''def build_fig4(date_range):
    specs = [(get_walcl, "WALCL"), (get_wresbal, "WRESBAL"), (get_wtre_gen, "WTREGEN"), (get_rrp_daily, "RRPONTSYD")]
    series = []
    for getter, column in specs:
        try:
            frame = getter().copy()
            frame["observation_date"] = pd.to_datetime(frame["observation_date"], errors="coerce")
            frame[column] = pd.to_numeric(frame[column], errors="coerce")
            frame = frame.dropna(subset=["observation_date", column]).sort_values("observation_date")[["observation_date", column]]
            if frame.empty:
                continue
            if column == "RRPONTSYD":
                frame[column] = frame[column] / 1000.0
                frame = frame.set_index("observation_date")[column].resample("W-WED").mean().rename(column).reset_index()
            else:
                frame[column] = frame[column] / 1000000.0
            series.append(frame)
        except Exception:
            continue
    if not series:
        return apply_chart_style(go.Figure(), chart_height(285, 470))
    data = series[0]
    for frame in series[1:]:
        data = data.merge(frame, on="observation_date", how="outer")
    data = data.sort_values("observation_date")
    value_cols = [c for c in ["WALCL", "WRESBAL", "WTREGEN", "RRPONTSYD"] if c in data.columns]
    data[value_cols] = data[value_cols].ffill()
    if "WALCL" in data.columns and "WTREGEN" in data.columns and "RRPONTSYD" in data.columns:
        data["NetLiquidity"] = data["WALCL"] - data["WTREGEN"] - data["RRPONTSYD"]
    data = filter_range(data, date_range)

    fig = go.Figure()
    # Levels: use separate scales so smaller liquidity components remain readable.
    for column, name, width, dash in [
        ("WRESBAL", "Reserve Balances", 2.4, None),
        ("WTREGEN", "TGA", 2.1, "dash"),
        ("RRPONTSYD", "ON RRP", 2.1, "dot"),
    ]:
        add_line(fig, data, column, name, width, dash, unit=" T")

    # Fed Total Assets gets its own right axis because its trend is otherwise visually compressed.
    if "WALCL" in data.columns:
        add_line(fig, data, "WALCL", "Fed Total Assets", 2.8, "dashdot", unit=" T")
    if "NetLiquidity" in data.columns:
        add_line(fig, data, "NetLiquidity", "Net Liquidity Proxy", 2.8, None, unit=" T")

    fig.update_layout(
        yaxis=dict(title="Liquidity components ($T)", fixedrange=True),
        yaxis2=dict(
            title="Fed Total Assets ($T)",
            overlaying="y",
            side="right",
            anchor="free",
            position=1.0,
            showgrid=False,
            fixedrange=True,
            automargin=True,
        ),
    )
    # Move Fed Total Assets onto the independent right axis.
    for trace in fig.data:
        if trace.name == "Fed Total Assets":
            trace.update(yaxis="y2")
    return apply_chart_style(fig, chart_height(285, 470))
'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git diff --cached --quiet || git commit -m "Improve Chart 4 readability"
          git push
