name: US source recovery regression
on:
  pull_request:
    branches: [main]
    paths:
      - app.py
      - macro_platform/spx_options.py
      - scripts/*.py
      - tests/test_us_automatic_refresh.py
      - .github/workflows/update-us-sources.yml
      - .github/workflows/us-source-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  us-source-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest xlrd curl_cffi==0.13.0
      - name: Verify isolated retries, exact source baskets, real Git races and app sessions
        run: |
          python -m pytest tests/test_us_automatic_refresh.py tests/test_source_freshness.py tests/test_dashboard_loading.py tests/test_chart_render_safety.py tests/test_consolidated_runtime.py tests/test_fred_observation_admission.py tests/test_fred_verified_cold_boot.py tests/test_spx_sentiment.py tests/test_ai_credit.py tests/test_equity_risk_refresh.py tests/test_cboe_close_supplement.py tests/test_tail_risk.py tests/test_maintenance_workflows.py tests/test_full_freshness.py tests/test_app_runtime_smoke.py tests/test_copper_context.py tests/test_cme_transport.py -q --junitxml=us-source-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-source-recovery-tests
          path: us-source-tests.xml
