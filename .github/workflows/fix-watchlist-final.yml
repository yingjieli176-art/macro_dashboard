name: Fix watchlist refresh isolation final
on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py'); s=p.read_text(encoding='utf-8')
          old='''@st.fragment(run_every="300s")\ndef render_market_groups():\n    refresh_key = _quote_refresh_key()\n    quotes = {'''
          new='''@st.fragment(run_every="300s")\ndef render_market_groups():\n    # Keep the top market snapshot in session state. A watchlist button interaction\n    # may rerun the script, but must not trigger fresh requests for these indices.\n    now = time.time()\n    snapshot = st.session_state.get("_market_quotes_snapshot")\n    snapshot_time = st.session_state.get("_market_quotes_snapshot_time", 0)\n    if not isinstance(snapshot, dict) or now - snapshot_time >= 300:\n        refresh_key = _quote_refresh_key()\n        snapshot = {\n            "nasdaq": _get_cached_quote("^IXIC", refresh_key),\n            "sp500": _get_cached_quote("^GSPC", refresh_key),\n            "dow": _get_cached_quote("^DJI", refresh_key),\n            "hsi": _get_cached_quote("^HSI", refresh_key),\n            "hstech": _get_cached_quote("HSTECH.HK", refresh_key),\n            "sh": _get_cached_quote("000001.SS", refresh_key),\n            "sz": _get_cached_quote("399001.SZ", refresh_key),\n            "csi300": _get_cached_quote("000300.SS", refresh_key),\n        }\n        st.session_state["_market_quotes_snapshot"] = snapshot\n        st.session_state["_market_quotes_snapshot_time"] = now\n    quotes = snapshot'''
          if old not in s: raise SystemExit('market function header not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Keep market data isolated from watchlist refresh" || true
          git rm .github/workflows/fix-watchlist-final.yml
          git commit -m "Remove temporary patch workflow"
          git push
