name: Add Treasury debt chart

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Add Treasury debt total and holder breakdown chart'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart 4
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.py')
          s = app.read_text(encoding='utf-8')

          s = s.replace(
              'from data import (get_dgs3mo, get_dgs2, get_dgs10, get_dfii10, get_sofr, get_iorb, get_effr, get_rrp_rate, get_sina_news)',
              'from data import (get_dgs3mo, get_dgs2, get_dgs10, get_dfii10, get_sofr, get_iorb, get_effr, get_rrp_rate, get_sina_news, get_gfdebtn, get_fygfdpun, get_fdhbfrbn, get_fdhbfin, get_fdhbpin)'
          )

          marker = 'def build_fig3(date_range):'
          insert = '''def build_fig4(date_range):
              total = get_gfdebtn().copy()
              total["GFDEBTN"] = total["GFDEBTN"] / 1000.0
              public = get_fygfdpun().copy()
              public["FYGFDPUN"] = public["FYGFDPUN"] / 1000.0
              fed = get_fdhbfrbn().copy()
              foreign = get_fdhbfin().copy()
              private = get_fdhbpin().copy()
              data = total.merge(public, on="observation_date", how="outer").merge(fed, on="observation_date", how="outer").merge(foreign, on="observation_date", how="outer").merge(private, on="observation_date", how="outer").sort_values("observation_date")
              data = filter_range(data, date_range)
              fig = go.Figure()
              add_line(fig, data, "GFDEBTN", "Total Public Debt", 2.8, unit=" T")
              add_line(fig, data, "FYGFDPUN", "Debt Held by Public", 2.5, unit=" T")
              add_line(fig, data, "FDHBFRBN", "Federal Reserve", 2.2, dash="dot", unit=" $B")
              add_line(fig, data, "FDHBFIN", "Foreign & International", 2.2, dash="dash", unit=" $B")
              add_line(fig, data, "FDHBPIN", "Private Investors", 2.2, dash="dot", unit=" $B")
              fig.update_layout(yaxis_title="Total / Public Debt ($T)")
              return apply_chart_style(fig, chart_height(285, 470))

          '''
          if marker not in s:
              raise SystemExit('build_fig3 marker not found')
          s = s.replace(marker, insert + marker, 1)

          old_param = '"3M：3个月期美国国债收益率。2Y：2年期美国国债收益率。10Y：10年期美国国债收益率。10Y−2Y：10年期与2年期美国国债收益率之差。10Y−3M：10年期与3个月期美国国债收益率之差。"]'
          new_param = '"3M：3个月期美国国债收益率。2Y：2年期美国国债收益率。10Y：10年期美国国债收益率。10Y−2Y：10年期与2年期美国国债收益率之差。10Y−3M：10年期与3个月期美国国债收益率之差。", "Total Public Debt：美国联邦政府总公共债务。Debt Held by Public：公众持有的联邦债务。Federal Reserve：美联储持有的联邦债务。Foreign & International：外国及国际投资者持有的联邦债务。Private Investors：私人投资者持有的联邦债务。"]'
          if old_param not in s:
              raise SystemExit('parameter description marker not found')
          s = s.replace(old_param, new_param, 1)

          old_config = '(None, \'<div class="compact-title">3. Treasury Yield</div>\', \'<div class="compact-description">3M / 2Y / 10Y / Curve Spread</div>\', "compact_treasury_range", build_fig3, [("DGS3MO", "https://fred.stlouisfed.org/series/DGS3MO"), ("DGS2", "https://fred.stlouisfed.org/series/DGS2"), ("DGS10", "https://fred.stlouisfed.org/series/DGS10"), ("T10Y2Y", "https://fred.stlouisfed.org/series/T10Y2Y"), ("T10Y3M", "https://fred.stlouisfed.org/series/T10Y3M")], 2)]'
          new_config = '(cols[0], \'<div class="compact-title">3. Treasury Yield</div>\', \'<div class="compact-description">3M / 2Y / 10Y / Curve Spread</div>\', "compact_treasury_range", build_fig3, [("DGS3MO", "https://fred.stlouisfed.org/series/DGS3MO"), ("DGS2", "https://fred.stlouisfed.org/series/DGS2"), ("DGS10", "https://fred.stlouisfed.org/series/DGS10"), ("T10Y2Y", "https://fred.stlouisfed.org/series/T10Y2Y"), ("T10Y3M", "https://fred.stlouisfed.org/series/T10Y3M")], 2), (cols[1], \'<div class="compact-title">4. Federal Debt: Total & Holders</div>\', \'<div class="compact-description">Total Debt / Public / Fed / Foreign / Private Holders</div>\', "compact_debt_range", build_fig4, [("GFDEBTN", "https://fred.stlouisfed.org/series/GFDEBTN"), ("FYGFDPUN", "https://fred.stlouisfed.org/series/FYGFDPUN"), ("FDHBFRBN", "https://fred.stlouisfed.org/series/FDHBFRBN"), ("FDHBFIN", "https://fred.stlouisfed.org/series/FDHBFIN"), ("FDHBPIN", "https://fred.stlouisfed.org/series/FDHBPIN")], 3)]'
          if old_config not in s:
              raise SystemExit('compact config marker not found')
          s = s.replace(old_config, new_config, 1)

          old_loop = 'for column, title, description, key, builder, sources, desc_index in configs[:2]:'
          new_loop = 'for column, title, description, key, builder, sources, desc_index in configs:'
          if old_loop not in s:
              raise SystemExit('compact loop marker not found')
          s = s.replace(old_loop, new_loop, 1)

          old_chart3 = '''        _, title, description, key, builder, sources, desc_index = configs[2]
        st.markdown('<div style="height:12px"></div>', unsafe_allow_html=True)
        st.markdown(title, unsafe_allow_html=True)
        st.markdown(description, unsafe_allow_html=True)
        date_range = st.radio("时间范围", RANGES, horizontal=True, index=1, key=key, label_visibility="collapsed")
        st.markdown('<div style="height:6px"></div>', unsafe_allow_html=True)
        st.plotly_chart(builder(date_range), use_container_width=True, config=PLOTLY_CONFIG)
        show_parameter_description(desc_index)
        add_sources(sources)'''
          if old_chart3 not in s:
              raise SystemExit('old chart3 block not found')
          s = s.replace(old_chart3, '', 1)

          app.write_text(s, encoding='utf-8')

          data = Path('data.py')
          d = data.read_text(encoding='utf-8')
          marker = '\n\n# =========================================================\n# TEXT CLEAN\n# =========================================================\n'
          funcs = '''

@st.cache_data(ttl=3600)
def get_gfdebtn():
    return _fred_series("GFDEBTN")


@st.cache_data(ttl=3600)
def get_fygfdpun():
    return _fred_series("FYGFDPUN")


@st.cache_data(ttl=3600)
def get_fdhbfrbn():
    return _fred_series("FDHBFRBN")


@st.cache_data(ttl=3600)
def get_fdhbfin():
    return _fred_series("FDHBFIN")


@st.cache_data(ttl=3600)
def get_fdhbpin():
    return _fred_series("FDHBPIN")
'''
          if marker not in d:
              raise SystemExit('data insertion marker not found')
          d = d.replace(marker, funcs + marker, 1)
          data.write_text(d, encoding='utf-8')
          PY
          python -m py_compile app.py data.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py data.py
          git commit -m "Add Treasury debt total and holder breakdown chart"
          git push
