name: Refresh completed MOVE index history
on:
  schedule:
    - cron: '43 0,7,12 * * 1-6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_move_index.py
      - macro_platform/move_index.py
      - .github/workflows/update-move-index.yml

permissions:
  contents: write

concurrency:
  group: move-index-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source parser dependencies
        run: python -m pip install pandas requests
      - name: Refresh completed MOVE index history
        run: python scripts/update_move_index.py
      - name: Publish the data snapshot only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/move_daily.json
          if git diff --cached --quiet; then
            echo 'MOVE closes unchanged'
            exit 0
          fi
          git commit -m 'data: refresh completed MOVE index history'
          bash scripts/push_snapshot.sh
