name: Sync verified FRED market observations
on:
  schedule:
    - cron: '10 23 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_fred_verified_cache.py
      - .github/workflows/sync-fred-verified-cache.yml

permissions:
  contents: write

concurrency:
  group: fred-official-observation-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source verification dependencies
        run: python -m pip install pandas requests
      - name: Download observed FRED data (never generate estimates)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/sync_fred_verified_cache.py
      - name: Validate sources for Fed Policy chart
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          present = 0
          for sid in ("IORB", "RRPONTSYAWARD", "EFFR", "SOFR"):
              file = Path("data_snapshots/fred_cache") / (sid + ".json")
              if not file.exists():
                  print("MISSING official source:", sid)
                  continue
              obj = json.loads(file.read_text())
              assert obj["series_id"] == sid
              assert len(obj["records"]) >= 12
              assert len({row["date"] for row in obj["records"]}) == len(obj["records"])
              assert obj["coverage_end"] == obj["records"][-1]["date"]
              present += 1
              print(sid, len(obj["records"]), obj["coverage_end"])
          assert present >= 2, "No valid partial Fed Policy chart"
          PY
      - name: Commit only verified observed FRED source values
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/fred_cache/
          if git diff --cached --quiet; then
            echo 'No new FRED observations'
            exit 0
          fi
          git commit -m 'data: refresh last-good FRED historical observations'
          git pull --rebase origin main
          git push origin main
