name: Add chart 4 final
on:
  push:
    branches:
      - main
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          s = app.read_text(encoding='utf-8')
          s = s.replace('from data import (get_dgs3mo, get_dgs2, get_dgs10, get_dfii10, get_sofr, get_iorb, get_effr, get_rrp_rate, get_sina_news)', 'from data import (get_dgs3mo, get_dgs2, get_dgs10, get_dfii10, get_sofr, get_iorb, get_effr, get_rrp_rate, get_sina_news, get_gfdebtn, get_fygfdpun, get_fdhbfrbn, get_fdhbfin, get_fdhbpin)', 1)
          s = s.replace('yaxis2=dict(title="Spread (bp)", overlaying="y", side="right", showgrid=False, zeroline=True, zerolinecolor="#9ca3af", fixedrange=True)', 'yaxis2=dict(title="Spread (bp)", overlaying="y", side="right", anchor="free", position=1.0, showgrid=False, zeroline=True, zerolinecolor="#9ca3af", fixedrange=True, automargin=True)', 1)

          if 'def build_fig4(date_range):' not in s:
              marker = 'def build_fig3(date_range):'
              insert = 'def build_fig4(date_range):\n    total = get_gfdebtn().copy(); total["GFDEBTN"] = total["GFDEBTN"] / 1000000.0\n    public = get_fygfdpun().copy(); public["FYGFDPUN"] = public["FYGFDPUN"] / 1000000.0\n    fed = get_fdhbfrbn().copy(); fed["FDHBFRBN"] = fed["FDHBFRBN"] / 1000.0\n    foreign = get_fdhbfin().copy(); foreign["FDHBFIN"] = foreign["FDHBFIN"] / 1000.0\n    private = get_fdhbpin().copy(); private["FDHBPIN"] = private["FDHBPIN"] / 1000.0\n    data = total.merge(public, on="observation_date", how="outer").merge(fed, on="observation_date", how="outer").merge(foreign, on="observation_date", how="outer").merge(private, on="observation_date", how="outer").sort_values("observation_date")\n    data = filter_range(data, date_range)\n    fig = go.Figure()\n    for column, name, width, dash in [("GFDEBTN", "Total Public Debt", 2.8, None), ("FYGFDPUN", "Debt Held by Public", 2.5, None), ("FDHBFRBN", "Federal Reserve", 2.2, "dot"), ("FDHBFIN", "Foreign & International", 2.2, "dash"), ("FDHBPIN", "Private Investors", 2.2, "dashdot")]: add_line(fig, data, column, name, width, dash, unit=" T")\n    fig.update_layout(yaxis_title="Debt ($T)")\n    return apply_chart_style(fig, chart_height(285, 470))\n\n'
              if marker not in s: raise SystemExit('build_fig3 marker not found')
              s = s.replace(marker, insert + marker, 1)

          oldp = '"3M：3个月期美国国债收益率。2Y：2年期美国国债收益率。10Y：10年期美国国债收益率。10Y−2Y：10年期与2年期美国国债收益率之差。10Y−3M：10年期与3个月期美国国债收益率之差。"]'
          newp = '"3M：3个月期美国国债收益率。2Y：2年期美国国债收益率。10Y：10年期美国国债收益率。10Y−2Y：10年期与2年期美国国债收益率之差。10Y−3M：10年期与3个月期美国国债收益率之差。", "Total Public Debt：美国联邦政府总公共债务。Debt Held by Public：公众持有的联邦债务。Federal Reserve：美联储持有的联邦债务。Foreign & International：外国及国际投资者持有的联邦债务。Private Investors：私人投资者持有的联邦债务。"]'
          s = s.replace(oldp, newp, 1)

          oldcfg = '(None, \'<div class="compact-title">3. Treasury Yield</div>\', \'<div class="compact-description">3M / 2Y / 10Y / Curve Spread</div>\', "compact_treasury_range", build_fig3, [("DGS3MO", "https://fred.stlouisfed.org/series/DGS3MO"), ("DGS2", "https://fred.stlouisfed.org/series/DGS2"), ("DGS10", "https://fred.stlouisfed.org/series/DGS10"), ("T10Y2Y", "https://fred.stlouisfed.org/series/T10Y2Y"), ("T10Y3M", "https://fred.stlouisfed.org/series/T10Y3M")], 2)]'
          newcfg = '(cols[0], \'<div class="compact-title">3. Treasury Yield</div>\', \'<div class="compact-description">3M / 2Y / 10Y / Curve Spread</div>\', "compact_treasury_range", build_fig3, [("DGS3MO", "https://fred.stlouisfed.org/series/DGS3MO"), ("DGS2", "https://fred.stlouisfed.org/series/DGS2"), ("DGS10", "https://fred.stlouisfed.org/series/DGS10"), ("T10Y2Y", "https://fred.stlouisfed.org/series/T10Y2Y"), ("T10Y3M", "https://fred.stlouisfed.org/series/T10Y3M")], 2), (cols[1], \'<div class="compact-title">4. Federal Debt: Total & Holders</div>\', \'<div class="compact-description">Total Debt / Public / Fed / Foreign / Private</div>\', "compact_debt_range", build_fig4, [("GFDEBTN", "https://fred.stlouisfed.org/series/GFDEBTN"), ("FYGFDPUN", "https://fred.stlouisfed.org/series/FYGFDPUN"), ("FDHBFRBN", "https://fred.stlouisfed.org/series/FDHBFRBN"), ("FDHBFIN", "https://fred.stlouisfed.org/series/FDHBFIN"), ("FDHBPIN", "https://fred.stlouisfed.org/series/FDHBPIN")], 3)]'
          if oldcfg not in s: raise SystemExit('chart3 config not found')
          s = s.replace(oldcfg, newcfg, 1)
          s = s.replace('for column, title, description, key, builder, sources, desc_index in configs[:2]:', 'for column, title, description, key, builder, sources, desc_index in configs:', 1)
          oldblock = '        _, title, description, key, builder, sources, desc_index = configs[2]\n        st.markdown(\'<div style="height:12px"></div>\', unsafe_allow_html=True)\n        st.markdown(title, unsafe_allow_html=True)\n        st.markdown(description, unsafe_allow_html=True)\n        date_range = st.radio("时间范围", RANGES, horizontal=True, index=1, key=key, label_visibility="collapsed")\n        st.markdown(\'<div style="height:6px"></div>\', unsafe_allow_html=True)\n        st.plotly_chart(builder(date_range), use_container_width=True, config=PLOTLY_CONFIG)\n        show_parameter_description(desc_index)\n        add_sources(sources)'
          s = s.replace(oldblock, '', 1)
          app.write_text(s, encoding='utf-8')

          data = Path('data.py')
          d = data.read_text(encoding='utf-8')
          if 'def get_gfdebtn()' not in d:
              marker = '\n\n# =========================================================\n# TEXT CLEAN\n# =========================================================\n'
              funcs = '\n\n@st.cache_data(ttl=3600)\ndef get_gfdebtn():\n    return _fred_series("GFDEBTN")\n\n@st.cache_data(ttl=3600)\ndef get_fygfdpun():\n    return _fred_series("FYGFDPUN")\n\n@st.cache_data(ttl=3600)\ndef get_fdhbfrbn():\n    return _fred_series("FDHBFRBN")\n\n@st.cache_data(ttl=3600)\ndef get_fdhbfin():\n    return _fred_series("FDHBFIN")\n\n@st.cache_data(ttl=3600)\ndef get_fdhbpin():\n    return _fred_series("FDHBPIN")\n'
              if marker not in d: raise SystemExit('data marker not found')
              d = d.replace(marker, funcs + marker, 1)
              data.write_text(d, encoding='utf-8')
          PY
          python -m py_compile app.py data.py
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py data.py
          git commit -m "Add Treasury debt chart and align chart axes"
          git push
