name: Add chart 4 final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.py')
          s = app.read_text(encoding='utf-8')

          # Add FRED debt series imports.
          old_import = 'from data import (get_dgs3mo, get_dgs2, get_dgs10, get_dfii10, get_sofr, get_iorb, get_effr, get_rrp_rate, get_sina_news)'
          new_import = 'from data import (get_dgs3mo, get_dgs2, get_dgs10, get_dfii10, get_sofr, get_iorb, get_effr, get_rrp_rate, get_sina_news, get_gfdebtn, get_fygfdpun, get_fdhbfrbn, get_fdhbfin, get_fdhbpin)'
          if old_import in s:
              s = s.replace(old_import, new_import, 1)

          # Put the secondary-axis title/ticks at the absolute right edge.
          old_axis = 'yaxis2=dict(title="Spread (bp)", overlaying="y", side="right", showgrid=False, zeroline=True, zerolinecolor="#9ca3af", fixedrange=True)'
          new_axis = 'yaxis2=dict(title="Spread (bp)", overlaying="y", side="right", anchor="free", position=1.0, showgrid=False, zeroline=True, zerolinecolor="#9ca3af", fixedrange=True, automargin=True)'
          s = s.replace(old_axis, new_axis, 1)

          # Add chart 4 once.
          if 'def build_fig4(date_range):' not in s:
              marker = 'def build_fig3(date_range):'
              insert = '''def build_fig4(date_range):
    total = get_gfdebtn().copy()
    total["GFDEBTN"] = total["GFDEBTN"] / 1_000_000.0
    public = get_fygfdpun().copy()
    public["FYGFDPUN"] = public["FYGFDPUN"] / 1_000_000.0
    fed = get_fdhbfrbn().copy()
    fed["FDHBFRBN"] = fed["FDHBFRBN"] / 1000.0
    foreign = get_fdhbfin().copy()
    foreign["FDHBFIN"] = foreign["FDHBFIN"] / 1000.0
    private = get_fdhbpin().copy()
    private["FDHBPIN"] = private["FDHBPIN"] / 1000.0
    data = total.merge(public, on="observation_date", how="outer").merge(fed, on="observation_date", how="outer").merge(foreign, on="observation_date", how="outer").merge(private, on="observation_date", how="outer").sort_values("observation_date")
    data = filter_range(data, date_range)
    fig = go.Figure()
    add_line(fig, data, "GFDEBTN", "Total Public Debt", 2.8, unit=" T")
    add_line(fig, data, "FYGFDPUN", "Debt Held by Public", 2.5, unit=" T")
    add_line(fig, data, "FDHBFRBN", "Federal Reserve", 2.2, "dot", unit=" T")
    add_line(fig, data, "FDHBFIN", "Foreign & International", 2.2, "dash", unit=" T")
    add_line(fig, data, "FDHBPIN", "Private Investors", 2.2, "dashdot", unit=" T")
    fig.update_layout(yaxis_title="Debt ($T)")
    return apply_chart_style(fig, chart_height(285, 470))

'''
              if marker not in s:
                  raise SystemExit('build_fig3 marker not found')
              s = s.replace(marker, insert + marker, 1)

          # Add chart 4 parameter description.
          old_params = '"3M：3个月期美国国债收益率。2Y：2年期美国国债收益率。10Y：10年期美国国债收益率。10Y−2Y：10年期与2年期美国国债收益率之差。10Y−3M：10年期与3个月期美国国债收益率之差。"]'
          new_params = '"3M：3个月期美国国债收益率。2Y：2年期美国国债收益率。10Y：10年期美国国债收益率。10Y−2Y：10年期与2年期美国国债收益率之差。10Y−3M：10年期与3个月期美国国债收益率之差。", "Total Public Debt：美国联邦政府总公共债务。Debt Held by Public：公众持有的联邦债务。Federal Reserve：美联储持有的联邦债务。Foreign & International：外国及国际投资者持有的联邦债务。Private Investors：私人投资者持有的联邦债务。"]'
          if old_params in s:
              s = s.replace(old_params, new_params, 1)

          # Replace compact chart 3 full-width layout with a 2x2 grid: 1/2 then 3/4.
          old_config = re.escape('(None, \'<div class="compact-title">3. Treasury Yield</div>\', \'<div class="compact-description">3M / 2Y / 10Y / Curve Spread</div>\', "compact_treasury_range", build_fig3, [("DGS3MO", "https://fred.stlouisfed.org/series/DGS3MO"), ("DGS2", "https://fred.stlouisfed.org/series/DGS2"), ("DGS10", "https://fred.stlouisfed.org/series/DGS10"), ("T10Y2Y", "https://fred.stlouisfed.org/series/T10Y2Y"), ("T10Y3M", "https://fred.stlouisfed.org/series/T10Y3M")], 2)]')
          if 'compact_debt_range' not in s:
              pattern = re.compile(r'\(None, \'<div class="compact-title">3\. Treasury Yield</div>\', \'<div class="compact-description">3M / 2Y / 10Y / Curve Spread</div>\', "compact_treasury_range", build_fig3, \[\("DGS3MO", "https://fred\.stlouisfed\.org/series/DGS3MO"\), \("DGS2", "https://fred\.stlouisfed\.org/series/DGS2"\), \("DGS10", "https://fred\.stlouisfed\.org/series/DGS10"\), \("T10Y2Y", "https://fred\.stlouisfed\.org/series/T10Y2Y"\), \("T10Y3M", "https://fred\.stlouisfed\.org/series/T10Y3M"\)\], 2\)\]')
              replacement = '(cols[0], \'<div class="compact-title">3. Treasury Yield</div>\', \'<div class="compact-description">3M / 2Y / 10Y / Curve Spread</div>\', "compact_treasury_range", build_fig3, [("DGS3MO", "https://fred.stlouisfed.org/series/DGS3MO"), ("DGS2", "https://fred.stlouisfed.org/series/DGS2"), ("DGS10", "https://fred.stlouisfed.org/series/DGS10"), ("T10Y2Y", "https://fred.stlouisfed.org/series/T10Y2Y"), ("T10Y3M", "https://fred.stlouisfed.org/series/T10Y3M")], 2), (cols[1], \'<div class="compact-title">4. Federal Debt: Total & Holders</div>\', \'<div class="compact-description">Total Debt / Public / Fed / Foreign / Private</div>\', "compact_debt_range", build_fig4, [("GFDEBTN", "https://fred.stlouisfed.org/series/GFDEBTN"), ("FYGFDPUN", "https://fred.stlouisfed.org/series/FYGFDPUN"), ("FDHBFRBN", "https://fred.stlouisfed.org/series/FDHBFRBN"), ("FDHBFIN", "https://fred.stlouisfed.org/series/FDHBFIN"), ("FDHBPIN", "https://fred.stlouisfed.org/series/FDHBPIN")], 3)]'
              s2, n = pattern.subn(replacement, s, count=1)
              if n != 1:
                  raise SystemExit('compact chart 3 config not found')
              s = s2

          # Compact loop already renders first two; change it to render all four.
          s = s.replace('for column, title, description, key, builder, sources, desc_index in configs[:2]:', 'for column, title, description, key, builder, sources, desc_index in configs:', 1)

          old_chart3 = '''        _, title, description, key, builder, sources, desc_index = configs[2]
        st.markdown('<div style="height:12px"></div>', unsafe_allow_html=True)
        st.markdown(title, unsafe_allow_html=True)
        st.markdown(description, unsafe_allow_html=True)
        date_range = st.radio("时间范围", RANGES, horizontal=True, index=1, key=key, label_visibility="collapsed")
        st.markdown('<div style="height:6px"></div>', unsafe_allow_html=True)
        st.plotly_chart(builder(date_range), use_container_width=True, config=PLOTLY_CONFIG)
        show_parameter_description(desc_index)
        add_sources(sources)'''
          s = s.replace(old_chart3, '', 1)

          app.write_text(s, encoding='utf-8')

          data = Path('data.py')
          d = data.read_text(encoding='utf-8')
          if 'def get_gfdebtn()' not in d:
              marker = '\n\n# =========================================================\n# TEXT CLEAN\n# =========================================================\n'
              funcs = '''

@st.cache_data(ttl=3600)
def get_gfdebtn():
    return _fred_series("GFDEBTN")


@st.cache_data(ttl=3600)
def get_fygfdpun():
    return _fred_series("FYGFDPUN")


@st.cache_data(ttl=3600)
def get_fdhbfrbn():
    return _fred_series("FDHBFRBN")


@st.cache_data(ttl=3600)
def get_fdhbfin():
    return _fred_series("FDHBFIN")


@st.cache_data(ttl=3600)
def get_fdhbpin():
    return _fred_series("FDHBPIN")
'''
              if marker not in d:
                  raise SystemExit('data insertion marker not found')
              d = d.replace(marker, funcs + marker, 1)
              data.write_text(d, encoding='utf-8')
          PY
          python -m py_compile app.py data.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py data.py
          git commit -m "Add Treasury debt chart and align chart axes" || true
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-chart4-final.yml
          git add -u .github/workflows/add-chart4-final.yml
          git commit -m "Remove temporary chart4 workflow" || true
          git push || true
