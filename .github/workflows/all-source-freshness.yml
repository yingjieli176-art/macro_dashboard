name: Verify all dashboard source dates
on:
  schedule:
    # Hourly around Asian and US closes; retain checks through UTC midnight.
    - cron: '17 0-8,12,16,20-23 * * *'
    # Extra attempts before the Beijing morning session; cron is best-effort.
    - cron: '43 21-23 * * *'
  workflow_run:
    workflows:
      - Refresh official VIX quote and confirmed close
      - Refresh completed SPX and RSP price history
      - Sync verified FRED market observations
    branches: [main]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_all_sources.py
      - scripts/refresh_audited_sources.py
      - scripts/publish_source_refresh.py
      - scripts/update_dxy_snapshot.py
      - macro_platform/market_history.py
      - tests/test_daily_observation_dates.py
      - tests/test_chart_calendar_dates.mjs
      - .github/workflows/all-source-freshness.yml
permissions:
  contents: write
concurrency:
  group: full-dashboard-source-dates
  cancel-in-progress: false
jobs:
  verify:
    # Only trusted default-branch scheduled/manual writers may trigger repair.
    # Never execute code or download artifacts from the triggering run.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt curl_cffi==0.13.0 akshare xlrd
      - name: Validate completed sessions and observation calendar dates
        run: |
          python -m unittest discover -s tests -p test_daily_observation_dates.py
          for chart_tz in Asia/Shanghai America/New_York UTC; do
            TZ="$chart_tz" node tests/test_chart_calendar_dates.mjs
          done
      - name: Identify published observations missing from local snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/probe_all_sources.py --output source_freshness_before.json
      - name: Refresh lagging families with validated source collectors
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_audited_sources.py source_freshness_before.json
      - name: Recheck sources after the first recovery pass
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/probe_all_sources.py --retry-from source_freshness_before.json --output source_freshness_after_first.json
      - name: Retry remaining lagging or temporarily unavailable sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_audited_sources.py source_freshness_after_first.json --output source_recovery_retry.json
      - name: Compare every configured source with its own observation calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/probe_all_sources.py --retry-from source_freshness_after_first.json --output data_snapshots/all_source_freshness.json --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-source-date-comparison
          path: |
            source_freshness_before.json
            source_freshness_after_first.json
            source_recovery.json
            source_recovery_retry.json
            data_snapshots/all_source_freshness.json
      - name: Publish verification results including unresolved sources
        if: always()
        run: |
          test -s data_snapshots/all_source_freshness.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_source_refresh.py

