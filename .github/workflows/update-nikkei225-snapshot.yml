name: Refresh verified Nikkei 225 daily closes
on:
  schedule:
    - cron: '45 7-10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_nikkei225_snapshot.py
      - macro_platform/market_history.py
      - .github/workflows/update-nikkei225-snapshot.yml
permissions:
  contents: write
concurrency:
  group: nikkei225-price-observations
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests
      - run: python scripts/update_nikkei225_snapshot.py
      - name: Commit only verified completed index closes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/nikkei225_daily.json
          if git diff --cached --quiet; then
            echo 'Nikkei 225 observations unchanged'
            exit 0
          fi
          git commit -m 'data: refresh completed Nikkei 225 daily closes'
          bash scripts/push_snapshot.sh
