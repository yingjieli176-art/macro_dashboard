name: Refresh verified TOPIX daily closes
on:
  schedule:
    - cron: '30 7,9 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_topix_snapshot.py
      - macro_platform/topix.py
      - .github/workflows/update-topix-snapshot.yml
permissions:
  contents: write
concurrency:
  group: topix-price-observations
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests lxml
      - run: python scripts/update_topix_snapshot.py
      - name: Commit verified TOPIX daily closes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/topix_daily.json
          if git diff --cached --quiet; then
            echo 'TOPIX observations unchanged'
            exit 0
          fi
          git commit -m 'data: refresh completed TOPIX daily closes'
          bash scripts/push_snapshot.sh
