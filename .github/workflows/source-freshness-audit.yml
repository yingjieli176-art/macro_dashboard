name: Audit actual source freshness
on:
  schedule:
    - cron: '53 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data_snapshots/**
      - scripts/audit_source_freshness.py
      - macro_platform/echarts_axes.py
      - .github/workflows/source-freshness-audit.yml
permissions:
  contents: read
concurrency:
  group: source-freshness-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas plotly
      - name: Check each field's actual date and publication cadence
        run: python scripts/audit_source_freshness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-source-freshness
          path: source_health.json
