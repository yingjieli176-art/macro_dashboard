name: Refine liquidity chart

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Chart 4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.py')
          s = p.read_text()

          start = s.index('def build_fig4(date_range):')
          end = s.index('\ndef build_fig3(date_range):', start)
          new_func = '''def build_fig4(date_range):
    specs = [(get_wresbal, "WRESBAL"), (get_rrp_daily, "RRPONTSYD")]
    series = []
    for getter, column in specs:
        try:
            frame = getter().copy()
            frame["observation_date"] = pd.to_datetime(frame["observation_date"], errors="coerce")
            frame[column] = pd.to_numeric(frame[column], errors="coerce")
            frame = frame.dropna(subset=["observation_date", column]).sort_values("observation_date")[["observation_date", column]]
            if not frame.empty:
                if column == "RRPONTSYD":
                    frame[column] = frame[column] / 1000.0
                    frame = frame.set_index("observation_date")[column].resample("W-WED").mean().rename(column).reset_index()
                else:
                    frame[column] = frame[column] / 1000000.0
                series.append(frame)
        except Exception:
            continue
    if not series:
        return apply_chart_style(go.Figure(), chart_height(285, 470))

    data = series[0]
    for frame in series[1:]:
        data = data.merge(frame, on="observation_date", how="outer")
    data = data.sort_values("observation_date")
    value_cols = [c for c in ["WRESBAL", "RRPONTSYD"] if c in data.columns]
    data[value_cols] = data[value_cols].ffill()
    if "WRESBAL" in data.columns and "RRPONTSYD" in data.columns:
        data["FedLiquidity"] = data["WRESBAL"] + data["RRPONTSYD"]
    data = filter_range(data, date_range)

    fig = go.Figure()
    add_line(fig, data, "FedLiquidity", "Fed Liquidity Supply", 3.2, unit=" T")
    fig.update_layout(
        yaxis=dict(title="Fed Liquidity Supply ($T)", fixedrange=True, showgrid=True, gridcolor="#eeeeee", zeroline=False),
        legend=dict(orientation="h", yanchor="bottom", y=1.01, xanchor="left", x=0),
    )
    return apply_chart_style(fig, chart_height(285, 470))
'''
          s = s[:start] + new_func + s[end:]

          s = s.replace(
              '<div class="compact-title">4. US Liquidity</div>',
              '<div class="compact-title">4. US Liquidity</div>'
          )
          s = s.replace(
              '<div class="compact-description">Fed Assets / Reserves / TGA / ON RRP / Net Liquidity</div>',
              '<div class="compact-description">Fed Liquidity Supply = Reserve Balances + ON RRP</div>'
          )
          s = s.replace(
              '<div class="section-description">Fed Assets / Reserves / TGA / ON RRP / Net Liquidity</div>',
              '<div class="section-description">Fed Liquidity Supply = Reserve Balances + ON RRP</div>'
          )
          s = s.replace(
              '"Fed Total Assets：美联储总资产。Reserve Balances：存款机构在美联储的准备金余额。TGA：美国财政部在美联储的总账户。ON RRP：隔夜逆回购余额。Net Liquidity Proxy：Fed Total Assets − TGA − ON RRP，用于观察流动性方向的代理指标，不是官方指标。"',
              '"Fed Liquidity Supply：准备金余额 + ON RRP。美联储研究中将 Reserve Balances + ON RRP 作为提供给私人部门的总流动性供给指标；该指标比 Net Liquidity Proxy 更直接，但仍不等同于整个金融体系的广义流动性。"'
          )
          p.write_text(s)
          PY

          rm -f .github/workflows/temp_liquidity_chart.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/temp_liquidity_chart.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refine Chart 4 liquidity display"
          git push
