name: Adjust chart axis detail
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adjust:
    if: github.event.head_commit.message != 'Adjust enlarged chart axis detail'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust axis detail and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"5Y": {"dtick": "M6", "tickformat": "%Y-%m"},', '"5Y": {"dtick": "M3", "tickformat": "%Y-%m"},')
          s = s.replace('"1Y": {"dtick": "M2", "tickformat": "%Y-%m"},', '"1Y": {"dtick": "M1", "tickformat": "%Y-%m"},')
          s = s.replace('"6M": {"dtick": "M2", "tickformat": "%Y-%m"},', '"6M": {"dtick": "M1", "tickformat": "%Y-%m"},')
          s = s.replace('"3M": {"dtick": "D14", "tickformat": "%m/%d"},', '"3M": {"dtick": "D7", "tickformat": "%m/%d"},')
          s = s.replace('"1M": {"dtick": "D7", "tickformat": "%m/%d"},', '"1M": {"dtick": "D3", "tickformat": "%m/%d"},')
          s = s.replace('tickfont=dict(size=9), tickangle=-20, ticklabelstandoff=5, automargin=True, **cfg)', 'tickfont=dict(size=11), tickangle=-20, ticklabelstandoff=6, automargin=True, **cfg)')
          s = s.replace('tickfont=dict(size=9), automargin=True)', 'tickfont=dict(size=11), automargin=True, nticks=8)')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/axis-detail.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py .github/workflows/axis-detail.yml
          git commit -m "Adjust enlarged chart axis detail"
          git push
