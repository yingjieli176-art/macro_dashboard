name: Stability hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          # A Streamlit button reruns the script automatically. Do not call
          # st.rerun from the button/callback path.
          s = s.replace('            st.session_state["_watchlist_refresh_key"] = st.session_state.get("_watchlist_refresh_key", 0) + 1\n            st.rerun()\n', '            st.session_state["_watchlist_refresh_key"] = st.session_state.get("_watchlist_refresh_key", 0) + 1\n')

          # Keep the top market cards in one Streamlit element. The old
          # st.columns tree was the source of visible horizontal reflow.
          pattern = r'def render_market_groups\(\):\n.*?\nrender_market_groups\(\)'
          replacement = '''def render_market_groups():
              now = time.time()
              snapshot = st.session_state.get("_market_quotes_snapshot")
              snapshot_time = st.session_state.get("_market_quotes_snapshot_time", 0)
              if not isinstance(snapshot, dict) or now - snapshot_time >= 300:
                  refresh_key = _quote_refresh_key()
                  snapshot = {
                      "nasdaq": _get_cached_quote("^IXIC", refresh_key),
                      "sp500": _get_cached_quote("^GSPC", refresh_key),
                      "dow": _get_cached_quote("^DJI", refresh_key),
                      "hsi": _get_cached_quote("^HSI", refresh_key),
                      "hstech": _get_cached_quote("HSTECH.HK", refresh_key),
                      "sh": _get_cached_quote("000001.SS", refresh_key),
                      "sz": _get_cached_quote("399001.SZ", refresh_key),
                      "csi300": _get_cached_quote("000300.SS", refresh_key),
                  }
                  st.session_state["_market_quotes_snapshot"] = snapshot
                  st.session_state["_market_quotes_snapshot_time"] = now
              q = snapshot
              groups = [
                  ("🇺🇸 美股", [
                      _market_item_html("纳斯达克", q["nasdaq"].get("price"), q["nasdaq"].get("change_pct"), _quote_meta(q["nasdaq"], "US")),
                      _market_item_html("标普500", q["sp500"].get("price"), q["sp500"].get("change_pct"), _quote_meta(q["sp500"], "US")),
                      _market_item_html("道琼斯", q["dow"].get("price"), q["dow"].get("change_pct"), _quote_meta(q["dow"], "US")),
                  ], "three"),
                  ("🇭🇰 港股", [
                      _market_item_html("恒生指数", q["hsi"].get("price"), q["hsi"].get("change_pct"), _quote_meta(q["hsi"], "HK")),
                      _market_item_html("恒生科技", q["hstech"].get("price"), q["hstech"].get("change_pct"), _quote_meta(q["hstech"], "HK")),
                  ], "two"),
                  ("🇨🇳 A股", [
                      _market_item_html("上证指数", q["sh"].get("price"), q["sh"].get("change_pct"), _quote_meta(q["sh"], "CN")),
                      _market_item_html("深证成指", q["sz"].get("price"), q["sz"].get("change_pct"), _quote_meta(q["sz"], "CN")),
                      _market_item_html("沪深300", q["csi300"].get("price"), q["csi300"].get("change_pct"), _quote_meta(q["csi300"], "CN")),
                  ], "three"),
              ]
              cards = []
              for title, items, grid_class in groups:
                  cards.append(f'<div class="market-group"><div class="market-group-title">{title}</div><div class="market-group-row {grid_class}">' + "".join(items) + '</div></div>')
              st.markdown('<div class="market-groups">' + "".join(cards) + '</div>', unsafe_allow_html=True)

render_market_groups()'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('render_market_groups replacement failed')

          # Eliminate every remaining fragment decorator.
          s = re.sub(r'^@st\.fragment\([^\n]*\)\n', '', s, flags=re.M)
          p.write_text(s, encoding='utf-8')

          # Fail fast on upstream APIs.
          p = Path('data.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('timeout=20,', 'timeout=4,').replace('timeout=15,', 'timeout=3,').replace('timeout=8,', 'timeout=4,').replace('timeout=5,', 'timeout=3,')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: python -m py_compile app.py data.py

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py data.py
          if git diff --cached --quiet; then
            echo 'No source changes required'
            exit 0
          fi
          git commit -m 'Fix rerun warning and top module reflow'
          git push origin main
