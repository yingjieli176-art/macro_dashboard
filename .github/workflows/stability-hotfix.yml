name: Stability hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden dashboard network calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove every Streamlit fragment auto-rerun decorator.
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'^@st\.fragment\([^\n]*\)\n', '', s, flags=re.M)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
              print('Removed all st.fragment decorators from app.py')

          # Keep external requests fail-fast so a cold Streamlit rerun cannot
          # be held for a long time by an unavailable upstream API.
          p = Path('data.py')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('timeout=20,', 'timeout=4,')
          s2 = s2.replace('timeout=15,', 'timeout=3,')
          s2 = s2.replace('timeout=8,', 'timeout=4,')
          s2 = s2.replace('timeout=5,', 'timeout=3,')
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
              print('Reduced FRED timeout to 4s and news timeout to 3s')
          PY

      - name: Validate Python syntax
        shell: bash
        run: python -m py_compile app.py data.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py data.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fail fast on slow macro data providers'
          git push origin main
