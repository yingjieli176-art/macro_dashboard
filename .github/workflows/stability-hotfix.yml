name: Stability hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden dashboard network calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove every Streamlit fragment auto-rerun decorator.
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'^@st\.fragment\([^\n]*\)\n', '', s, flags=re.M)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
              print('Removed all st.fragment decorators from app.py')

          # Keep external requests from holding the whole Streamlit run for
          # tens of seconds when an upstream API is slow/unreachable.
          p = Path('data.py')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('timeout=20,', 'timeout=8,')
          s2 = s2.replace('timeout=15,', 'timeout=5,')
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
              print('Reduced FRED timeout 20s->8s and news timeout 15s->5s')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py data.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Harden dashboard refresh against slow external APIs'
          git push origin main
