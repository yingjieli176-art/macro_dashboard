name: Refresh daily yen market index
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - macro_platform/yen_index.py
      - scripts/update_yen_market.py
      - .github/workflows/update-yen-market.yml
permissions:
  contents: write
concurrency:
  group: yen-market-observations
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests streamlit==1.64.0
      - run: python scripts/update_yen_market.py
      - name: Commit verified completed FX observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/jpy_market_daily.json
          if git diff --cached --quiet; then
            echo 'Completed yen market observations unchanged'
            exit 0
          fi
          git commit -m 'data: refresh completed USDJPY closes for yen index'
          bash scripts/push_snapshot.sh
