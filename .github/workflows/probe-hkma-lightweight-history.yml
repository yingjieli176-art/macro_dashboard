name: Probe HKMA lightweight history

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-hkma-lightweight-history.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe smaller HKMA endpoints
        run: |
          python - <<'PY'
          import json, urllib.request, time
          urls={
            'money':'https://api.hkma.gov.hk/public/market-data-and-statistics/monthly-statistical-bulletin/money/supply-adjusted?segment=new&pagesize=100&sortby=end_of_month&sortorder=desc',
            'base':'https://api.hkma.gov.hk/public/market-data-and-statistics/monthly-statistical-bulletin/monetary-operation/monetary-base-endperiod?pagesize=100&sortby=end_of_month&sortorder=desc',
          }
          ok=0
          for name,url in urls.items():
              t=time.time()
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'MacroDashboard/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=25) as r: payload=json.load(r)
                  rows=(payload.get('result') or {}).get('records') or []
                  print(name,'seconds',round(time.time()-t,2),'rows',len(rows),'first',rows[:2],'last',rows[-2:])
                  if len(rows)>=60: ok+=1
              except Exception as exc:
                  print(name,'ERR',repr(exc),'seconds',round(time.time()-t,2))
          assert ok>=1, 'neither lightweight HKMA endpoint returned 5Y history'
          PY
