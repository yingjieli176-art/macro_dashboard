name: Force dashboard diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert section 4
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          marker = '# =========================================================\n# Footer\n# ========================================================='
          if 'System Diagnostics' not in s:
              block = '''# =========================================================\n# 4. System Diagnostics\n# =========================================================\n\nst.markdown('<div class="section-title">4. System Diagnostics</div>', unsafe_allow_html=True)\n\nwith st.expander("🔧 检查数据源 / 运行状态", expanded=True):\n    import requests\n    from datetime import datetime\n    rows = [("Streamlit App", True, "app.py 已执行到诊断模块")]\n    try:\n        x = get_dgs10()\n        rows.append(("FRED API", x is not None and not x.empty, f"DGS10 返回 {len(x)} 条"))\n    except Exception as e:\n        rows.append(("FRED API", False, str(e)[:180]))\n    try:\n        x, err = get_sina_news(limit=1)\n        rows.append(("Sina 7×24", bool(x), "新浪返回数据" if x else (err or "返回空数据")))\n    except Exception as e:\n        rows.append(("Sina 7×24", False, str(e)[:180]))\n    try:\n        r = requests.get("https://np-weblist.eastmoney.com/comm/web/getFastNewsList", params={"client":"web","biz":"web_724","fastColumn":"102","pageSize":1}, timeout=8, headers={"User-Agent":"Mozilla/5.0","Referer":"https://kuaixun.eastmoney.com/"})\n        r.raise_for_status()\n        items = r.json().get("data", {}).get("fastNewsList", [])\n        rows.append(("Eastmoney 7×24", bool(items), "Eastmoney 返回数据" if items else "接口可访问，但返回空数据"))\n    except Exception as e:\n        rows.append(("Eastmoney 7×24", False, str(e)[:180]))\n    try:\n        x, err = get_wsj_news(limit=1)\n        rows.append(("WSJ", bool(x), "WSJ headlines 返回数据" if x else (err or "返回空数据")))\n    except Exception as e:\n        rows.append(("WSJ", False, str(e)[:180]))\n    for name, ok, detail in rows:\n        st.markdown(f"{'✅' if ok else '❌'} **{name}** — {detail}")\n    st.caption(f"Compact Mode: {'ON' if compact_mode else 'OFF'} · Last Check: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}")\n\n\n'''
              if marker not in s:
                  raise SystemExit('Footer marker not found')
              p.write_text(s.replace(marker, block + marker, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Add visible section 4 diagnostics'
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/force_diagnostics.yml
          git add .github/workflows/force_diagnostics.yml
          git diff --cached --quiet || git commit -m 'Remove temporary diagnostics workflow'
          git push || true
