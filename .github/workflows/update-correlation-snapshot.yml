name: Refresh official Cboe implied correlation
on:
  schedule:
    - cron: '45 23 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_correlation_snapshot.py
      - .github/workflows/update-correlation-snapshot.yml

permissions:
  contents: write

concurrency:
  group: official-cboe-correlation-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Cboe fetch dependencies
        run: python -m pip install pandas requests
      - name: Refresh original COR1M and COR3M closes
        run: python scripts/update_correlation_snapshot.py
      - name: Commit verified correlation observations only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/cor1m_daily.json data_snapshots/cor3m_daily.json
          if git diff --cached --quiet; then
            echo 'Official implied correlation history unchanged'
            exit 0
          fi
          git commit -m 'data: update official Cboe implied correlation closes'
          bash scripts/push_snapshot.sh
