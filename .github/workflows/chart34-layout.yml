name: Chart 3 width and right axis
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('fig.update_layout(yaxis=dict(title="Yield (%)", fixedrange=True), yaxis2=dict(title="Spread (bp)", overlaying="y", side="right", showgrid=False, zeroline=True, zerolinecolor="#9ca3af", fixedrange=True)); return apply_chart_style(fig, chart_height(285, 500))', 'fig.update_layout(yaxis=dict(title="Yield (%)", fixedrange=True), yaxis2=dict(title="Spread (bp)", overlaying="y", side="right", anchor="free", position=1.0, title_standoff=18, showgrid=False, zeroline=True, zerolinecolor="#9ca3af", fixedrange=True)); return apply_chart_style(fig, chart_height(285, 500))')
          old = '''        _, title, description, key, builder, sources, desc_index = configs[2]
        st.markdown('<div style="height:12px"></div>', unsafe_allow_html=True)
        st.markdown(title, unsafe_allow_html=True)
        st.markdown(description, unsafe_allow_html=True)
        date_range = st.radio("时间范围", RANGES, horizontal=True, index=1, key=key, label_visibility="collapsed")
        st.markdown('<div style="height:6px"></div>', unsafe_allow_html=True)
        st.plotly_chart(builder(date_range), use_container_width=True, config=PLOTLY_CONFIG)
        show_parameter_description(desc_index)
        add_sources(sources)'''
          new = '''        chart3_col, _ = st.columns(2, gap="large")
        _, title, description, key, builder, sources, desc_index = configs[2]
        with chart3_col:
            st.markdown('<div style="height:12px"></div>', unsafe_allow_html=True)
            st.markdown(title, unsafe_allow_html=True)
            st.markdown(description, unsafe_allow_html=True)
            date_range = st.radio("时间范围", RANGES, horizontal=True, index=1, key=key, label_visibility="collapsed")
            st.markdown('<div style="height:6px"></div>', unsafe_allow_html=True)
            st.plotly_chart(builder(date_range), use_container_width=True, config=PLOTLY_CONFIG)
            show_parameter_description(desc_index)
            add_sources(sources)'''
          if old not in s:
              raise SystemExit('target chart3 layout not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Align right axis and reserve chart 4 space"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/chart34-layout.yml
          git add -u .github/workflows/chart34-layout.yml
          git commit -m "Remove temporary chart layout workflow" || true
          git push || true
