name: Fix watchlist refresh isolation
on:
  push:
    paths:
      - '.github/workflows/fix-watchlist-refresh-isolation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          old = '''def _refresh_quote_cache():\n    # Only invalidate the user-added watchlist quotes. Keep the top market\n    # index cards cached so clicking refresh cannot break/reload them.\n    st.session_state["_watchlist_quote_refresh_nonce"] = st.session_state.get("_watchlist_quote_refresh_nonce", 0) + 1\n'''
          new = '''@st.cache_data(ttl=20, show_spinner=False)\ndef _get_watchlist_quote(symbol):\n    if str(symbol).upper().endswith((".SS", ".SZ", ".HK")) or str(symbol).upper() in ("^HSI", "^HSTECH"):\n        row = _get_eastmoney_quote_safe(symbol)\n        if row.get("price") is not None: return row\n    return _get_yahoo_quote_safe(symbol)\n\ndef _refresh_quote_cache():\n    # Refresh ONLY the user-added stock modules. The top market index cards\n    # use a separate cache and are never invalidated by this button.\n    _get_watchlist_quote.clear()\n'''
          if old not in s:
              raise SystemExit('refresh block not found')
          s = s.replace(old, new, 1)
          old2 = 'row = _get_cached_quote(item["symbol"], _watchlist_quote_refresh_key())'
          if old2 not in s:
              raise SystemExit('watchlist quote call not found')
          s = s.replace(old2, 'row = _get_watchlist_quote(item["symbol"])', 1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git commit -m 'Isolate watchlist refresh cache' || true
          git rm .github/workflows/fix-watchlist-refresh-isolation.yml
          git commit -m 'Remove one-off refresh patch workflow'
          git push