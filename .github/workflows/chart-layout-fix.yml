name: Fix core chart layout
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('max-width: 1400px;', 'max-width: 1700px;')
          s=s.replace('chart_height(320, 470)', 'chart_height(285, 470)')
          s=s.replace('chart_height(320, 500)', 'chart_height(285, 500)')
          old='''    if compact_mode:\n        cols = st.columns([1, 1, 1], gap="large")\n        configs = ['''
          new='''    if compact_mode:\n        top_cols = st.columns(2, gap="large")\n        configs = ['''
          if old not in s: raise SystemExit('layout marker not found')
          s=s.replace(old,new,1)
          marker='''        for column, title, description, key, builder, sources, desc_index in configs:\n            with column:\n'''
          replacement='''        for column, title, description, key, builder, sources, desc_index in [(top_cols[0], *configs[0][1:]), (top_cols[1], *configs[1][1:])]:\n            with column:\n'''
          if marker not in s: raise SystemExit('render marker not found')
          s=s.replace(marker,replacement,1)
          anchor='''                add_sources(sources)\n    else:\n'''
          replacement2='''                add_sources(sources)\n        column, title, description, key, builder, sources, desc_index = configs[2]\n        st.markdown('<div style="height:10px"></div>', unsafe_allow_html=True)\n        st.markdown(title, unsafe_allow_html=True)\n        st.markdown(description, unsafe_allow_html=True)\n        date_range = st.radio("时间范围", RANGES, horizontal=True, index=1, key=key, label_visibility="collapsed")\n        st.markdown('<div style="height:8px"></div>', unsafe_allow_html=True)\n        st.plotly_chart(builder(date_range), use_container_width=True, config=PLOTLY_CONFIG)\n        show_parameter_description(desc_index)\n        add_sources(sources)\n    else:\n'''
          if anchor not in s: raise SystemExit('anchor not found')
          s=s.replace(anchor,replacement2,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Set charts 1-2 top and chart 3 full width'
          git push
      - name: Remove workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/chart-layout-fix.yml
          git add -u .github/workflows/chart-layout-fix.yml
          git commit -m 'Remove temporary chart layout workflow' || true
          git push || true
