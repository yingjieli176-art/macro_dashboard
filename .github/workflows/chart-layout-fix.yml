name: Apply chart layout fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[chart-layout-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('max-width: 1900px;', 'max-width: 2200px;')
          s = s.replace('cols = st.columns(2, gap="large")', 'cols = st.columns(2, gap="small")')
          old = '''            "5Y": {"dtick": "M6", "tickformat": "%Y"},
            "1Y": {"dtick": "M2", "tickformat": "%b\'%y"},
            "6M": {"dtick": "M1", "tickformat": "%b"},
            "3M": {"dtick": "D14", "tickformat": "%m/%d"},
            "1M": {"dtick": "D7", "tickformat": "%m/%d"},'''
          new = '''            "5Y": {"dtick": "M12", "tickformat": "%Y"},
            "1Y": {"dtick": "M3", "tickformat": "%b\'%y"},
            "6M": {"dtick": "M2", "tickformat": "%b"},
            "3M": {"dtick": "D21", "tickformat": "%m/%d"},
            "1M": {"dtick": "D10", "tickformat": "%m/%d"},'''
          if old not in s:
              raise SystemExit('compact x-axis block not found')
          s = s.replace(old, new, 1)
          s = s.replace('tickangle, tick_size = -40, 9', 'tickangle, tick_size = -25, 8')
          s = s.replace('right_margin = 76 if has_secondary else 44', 'right_margin = 92 if has_secondary else 44')
          s = s.replace('''PARAM_DESCRIPTIONS = ["IORB（Interest on Reserve Balances）：美联储对存放在美联储的准备金余额支付的利率。ON RRP（Overnight Reverse Repurchase Agreement）：美联储隔夜逆回购工具的利率。EFFR（Effective Federal Funds Rate）：美国联邦基金市场的有效隔夜利率。SOFR（Secured Overnight Financing Rate）：以美国国债为抵押的隔夜融资利率。", "10Y Nominal：10年期美国国债名义收益率。10Y Real：10年期美国国债实际收益率，通常指10年期TIPS实际收益率。Breakeven：FRED官方10年期盈亏平衡通胀率（T10YIE）。", "3M：3个月期美国国债收益率。2Y：2年期美国国债收益率。10Y：10年期美国国债收益率。10Y−2Y：FRED官方10年期与2年期美国国债收益率利差（T10Y2Y）。10Y−3M：FRED官方10年期与3个月期美国国债收益率利差（T10Y3M）。", "Net Liquidity Proxy：Reserve Balances − TGA − ON RRP，用于观察美国金融市场流动性方向的分析指标，不是美联储官方命名指标。Reserve Balances：存款机构在美联储的准备金余额。TGA：美国财政部在美联储的总账户。ON RRP：隔夜逆回购余额。"]''', '''PARAM_DESCRIPTIONS = ["IORB（Interest on Reserve Balances）：美联储对存放在美联储的准备金余额支付的利率。ON RRP（Overnight Reverse Repurchase Agreement）：美联储隔夜逆回购工具的利率。EFFR（Effective Federal Funds Rate）：美国联邦基金市场的有效隔夜利率。SOFR（Secured Overnight Financing Rate）：以美国国债为抵押的隔夜融资利率。", "10Y Nominal：10年期美国国债名义收益率。10Y Real (R)：10年期美国国债实际收益率，通常指10年期TIPS实际收益率，使用右侧坐标轴。Breakeven (R)：FRED官方10年期盈亏平衡通胀率（T10YIE），使用右侧坐标轴。", "3M：3个月期美国国债收益率。2Y：2年期美国国债收益率。10Y：10年期美国国债收益率。10Y−2Y (R)：FRED官方10年期与2年期美国国债收益率利差（T10Y2Y），使用右侧坐标轴。10Y−3M (R)：FRED官方10年期与3个月期美国国债收益率利差（T10Y3M），使用右侧坐标轴。", "Net Liquidity Proxy：Reserve Balances − TGA − ON RRP，用于观察美国金融市场流动性方向的分析指标，不是美联储官方命名指标。Reserve Balances：存款机构在美联储的准备金余额。TGA：美国财政部在美联储的总账户。ON RRP：隔夜逆回购余额。"]''')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m '[chart-layout-fix] reduce date overlap and clarify right axis'
          git push
