name: Viewport Y-axis regression
on:
  push:
    branches: [main]
    paths:
      - app.py
      - macro_platform/market_history.py
      - macro_platform/background_refresh.py
      - macro_platform/request_runtime.py
      - tests/test_consolidated_runtime.py
      - tests/test_release_acceptance.py
      - tests/browser_offline_app.py
      - scripts/check_browser_release.py
      - tests/test_accuracy_performance.py
      - static/deploy_version.json
      - scripts/update_hk_market_daily.py
      - data.py
      - requirements.txt
      - macro_platform/chart_axes.py
      - macro_platform/echarts_axes.py
      - tests/test_viewport_axes.py
      - tests/test_echarts_axes.py
      - tests/test_chart_render_safety.py
      - tests/test_data_axis_integrity.py
      - tests/test_truth_source_integrity.py
      - macro_platform/copper.py
      - macro_platform/asia_rates.py
      - scripts/update_copper_snapshot.py
      - tests/test_us_five_year_real_yield.py
      - tests/test_refresh_optimizations.py
      - tests/test_dashboard_loading.py
      - tests/test_hk_liquidity_real_snapshot.py
      - tests/test_us_liquidity_source_freshness.py
      - macro_platform/treasury_cash.py
      - scripts/sync_tga_daily_snapshot.py
      - tests/test_tga_closing_schema_2022.py
      - .github/workflows/sync-tga-official-snapshot.yml
      - macro_platform/hk_liquidity.py
      - scripts/update_vixeq_snapshot.py
      - .github/workflows/update-vixeq-snapshot.yml
      - tests/test_app_runtime_smoke.py
      - tests/test_fred_verified_cold_boot.py
      - scripts/sync_fred_verified_cache.py
      - .github/workflows/sync-fred-verified-cache.yml
      - tests/test_app_import_compat.py
      - .github/workflows/viewport-axis-regression.yml
  pull_request:
    branches: [main]
    paths:
      - app.py
      - macro_platform/market_history.py
      - macro_platform/background_refresh.py
      - macro_platform/request_runtime.py
      - tests/test_consolidated_runtime.py
      - tests/test_release_acceptance.py
      - tests/browser_offline_app.py
      - scripts/check_browser_release.py
      - tests/test_accuracy_performance.py
      - static/deploy_version.json
      - scripts/update_hk_market_daily.py
      - tests/test_app_import_compat.py
      - data.py
      - macro_platform/copper.py
      - macro_platform/asia_rates.py
      - scripts/update_copper_snapshot.py
      - tests/test_truth_source_integrity.py
      - data_snapshots/copper_market_daily.json
      - macro_platform/echarts_axes.py
      - macro_platform/chart_axes.py
      - tests/test_echarts_axes.py
      - tests/test_chart_render_safety.py
      - tests/test_data_axis_integrity.py
      - tests/test_us_five_year_real_yield.py
      - tests/test_refresh_optimizations.py
      - tests/test_dashboard_loading.py
      - tests/test_hk_liquidity_real_snapshot.py
      - tests/test_us_liquidity_source_freshness.py
      - macro_platform/treasury_cash.py
      - scripts/sync_tga_daily_snapshot.py
      - tests/test_tga_closing_schema_2022.py
      - .github/workflows/sync-tga-official-snapshot.yml
      - macro_platform/hk_liquidity.py
      - scripts/update_vixeq_snapshot.py
      - .github/workflows/update-vixeq-snapshot.yml
      - tests/test_app_runtime_smoke.py
      - tests/test_fred_verified_cold_boot.py
      - scripts/sync_fred_verified_cache.py
      - .github/workflows/sync-fred-verified-cache.yml
      - tests/test_viewport_axes.py
      - .github/workflows/viewport-axis-regression.yml
  workflow_dispatch:

jobs:
  axes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Verify audit accuracy and progressive loading regressions
        run: python -m unittest discover -s tests -p "test_accuracy_performance.py" -v
      - name: Syntax check application and chart modules
        run: python -m compileall -q app.py data.py macro_platform tests
      - name: Verify Streamlit native ECharts API
        run: |
          python - <<'PY'
          import inspect
          import streamlit as st
          assert hasattr(st, "echarts_chart"), "Streamlit runtime lacks st.echarts_chart"
          parameters = inspect.signature(st.echarts_chart).parameters
          assert "theme" in parameters and "key" in parameters
          print("Streamlit", st.__version__, "supports native ECharts")
          PY
      - name: Smoke-test actual app.py startup imports
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("app.py").read_text(encoding="utf-8")
          imports = source.split("st.set_page_config(", 1)[0]
          assert "import macro_platform.echarts_axes as _echarts_axes" in imports
          exec(compile(imports, "app.py", "exec"), {})
          print("PASS: application startup import chain")
          PY
      - name: Simulate missing or partially deployed ECharts module
        run: python -m unittest discover -s tests -p "test_app_import_compat.py" -v
      - name: Regression tests for viewport fit and observation dates
        run: python -m unittest discover -s tests -p "test_*axes.py" -v
      - name: Chart renderer crash isolation
        run: python -m unittest discover -s tests -p "test_chart_render_safety.py" -v
      - name: Validate real FRED downloads and cold-start source snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/sync_fred_verified_cache.py --core-only
      - name: Verify cold-start official data integrity and no fabricated observations
        run: python -m unittest discover -s tests -p "test_fred_verified_cold_boot.py" -v
      - name: Verify series dates, units and data integrity
        run: python -m unittest discover -s tests -p "test_data_axis_integrity.py" -v
      - name: Cross-check market-source integrity and derived-rate disclosure
        run: python -m unittest discover -s tests -p "test_truth_source_integrity.py" -v
      - name: Verify official 5Y TIPS real yield in US charts
        run: python -m unittest discover -s tests -p "test_us_five_year_real_yield.py" -v
      - name: Verify fragment-only redraw and reuse of prefetched charts
        run: python -m unittest discover -s tests -p "test_refresh_optimizations.py" -v
      - name: Verify real HKMA charts 6 and 7 survive with stored observations
        run: python -m unittest discover -s tests -p "test_hk_liquidity_real_snapshot.py" -v
      - name: Verify TGA freshness and reject stale net liquidity
        run: python -m unittest discover -s tests -p "test_us_liquidity_source_freshness.py" -v
      - name: Verify Treasury Closing Balance semantic schema change since April 2022
        run: python -m unittest discover -s tests -p "test_tga_closing_schema_2022.py" -v
      - name: Verify newest real Treasury FiscalData TGA observations are reachable
        run: python scripts/sync_tga_daily_snapshot.py --verify-only
      - name: Verify macro dashboard cache reuse
        run: python -m unittest discover -s tests -p "test_dashboard_loading.py" -v
      - name: Execute complete offline Streamlit page
        run: python -m unittest discover -s tests -p "test_app_runtime_smoke.py" -v
      - name: Run complete regression suite including Asia curves and date controls
        run: python -m unittest discover -s tests -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and browser test dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Run Chromium against the actual app with offline real snapshots
        run: |
          python -m streamlit run tests/browser_offline_app.py --server.headless=true --global.developmentMode=false > browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=1)
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise RuntimeError('Browser test server did not start')
          PY
          python scripts/check_browser_release.py
      - name: Preserve browser evidence and actual acceptance status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-acceptance
          path: |
            browser_acceptance.json
            browser_acceptance.png
            browser-server.log
          if-no-files-found: error

  raw-history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install observation parser dependencies
        run: python -m pip install pandas requests
      - name: Validate raw Hong Kong closes from the live source
        run: python scripts/update_hk_market_daily.py --raw-only
      - name: Keep corrected observations for review before deployment
        uses: actions/upload-artifact@v4
        with:
          name: verified-hk-raw-history
          path: data_snapshots/hk_market_daily.json
          if-no-files-found: error


      - name: Collect all available verified FRED history for the same review
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/sync_fred_verified_cache.py
      - name: Preserve verified source snapshots and per-series coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-fred-history
          path: |
            data_snapshots/fred_cache/
            fred_sync_health.json
          if-no-files-found: error
