name: Dashboard regression
on:
  push:
    branches: [main]
    paths:
      - app.py
      - data.py
      - requirements.txt
      - macro_platform/**
      - scripts/**
      - tests/**
      - static/deploy_version.json
      - .github/workflows/viewport-axis-regression.yml
  pull_request:
    branches: [main]
    paths:
      - app.py
      - data.py
      - requirements.txt
      - macro_platform/**
      - scripts/**
      - tests/**
      - data_snapshots/**
      - static/deploy_version.json
      - .github/workflows/viewport-axis-regression.yml
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production requirements and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Run complete application regression independently of live-source probes
        run: python -m pytest tests -q --tb=short --junitxml=regression-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-regression-results
          path: regression-tests.xml

  axes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check application and chart modules
        run: python -m compileall -q app.py data.py macro_platform tests
      - name: Validate real FRED downloads and cold-start source snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/sync_fred_verified_cache.py --core-only
      - name: Verify newest real Treasury FiscalData TGA observations are reachable
        run: python scripts/sync_tga_daily_snapshot.py --verify-only
      - name: Verify the completed daily yen market source from this runner
        run: python scripts/update_yen_market.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and browser test dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Run Chromium against the actual app with offline real snapshots
        run: |
          # Static serving is relative to the entry point. The offline wrapper
          # lives in tests/, while production app.py serves the root static/.
          ln -s ../static tests/static
          python -m streamlit run tests/browser_offline_app.py --server.headless=true --global.developmentMode=false > browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=1)
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise RuntimeError('Browser test server did not start')
          PY
          python scripts/check_browser_release.py
      - name: Preserve browser evidence and actual acceptance status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-acceptance
          path: |
            browser_acceptance.json
            browser_acceptance.png
            browser_ai_cds.png
            browser_copper_tcrc.png
            browser_srf_usage.png
            browser_ten_year_tips.png
            browser_mobile.png
            browser_equity_drawdown.png
            browser_china_drawdown.png
            browser_freshness.png
            browser_session_b.png
            browser-server.log
          if-no-files-found: error

  rollback-restoration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 52e0b5d2c36e1be577b43afcf962878292b1c926
          path: rollback-target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the recorded tree's requirements in a fresh CI process
        run: |
          python -m pip install -r rollback-target/requirements.txt playwright
          python -m pip check
          python -m pip freeze > rollback-dependencies.txt
          python -m playwright install --with-deps chromium
      - name: Reboot and execute restored code with its own source snapshots
        env:
          MACRO_ACCEPTANCE_APP_ROOT: ${{ github.workspace }}/rollback-target
        run: |
          python -m streamlit run tests/browser_offline_app.py --server.port=8502 --server.headless=true --global.developmentMode=false > rollback-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health', timeout=1)
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise RuntimeError('Restored tree server did not start')
          PY
          python scripts/check_rollback_release.py --root rollback-target --sha 52e0b5d2c36e1be577b43afcf962878292b1c926
      - name: Preserve restoration evidence and unresolved release gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-rollback-restoration
          path: |
            rollback_acceptance.json
            rollback_acceptance.png
            rollback-server.log
            rollback-dependencies.txt
          if-no-files-found: error

  runtime-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the final candidate's pinned runtime
        run: python -m pip install -r requirements.txt
      - name: Collect server timings and settled resources in Linux CI
        run: python scripts/benchmark_runtime.py --cold 3 --warm 100 --interactions 100
      - name: Preserve timing samples without claiming Cloud latency
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-runtime-samples
          path: runtime_benchmark.json
          if-no-files-found: error

  all-source-dates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt akshare xlrd curl_cffi==0.13.0
      - name: Verify raw dates and compare all 17 charts with live sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/audit_source_freshness.py --output source_health.json
          python scripts/probe_all_sources.py --output all_source_freshness_before.json
      - name: Refresh confirmed lag with existing validated collectors
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_audited_sources.py all_source_freshness_before.json
      - name: Verify dates again after source refreshes
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/audit_source_freshness.py --output source_health.json
          python scripts/probe_all_sources.py --output all_source_freshness.json --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-source-date-audit
          path: |
            source_health.json
            all_source_freshness_before.json
            all_source_freshness.json
            data_snapshots/
          if-no-files-found: error

  raw-history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install observation parser dependencies
        run: python -m pip install pandas requests
      - name: Validate raw Hong Kong closes from the live source
        run: python scripts/update_hk_market_daily.py --raw-only
      - name: Keep corrected observations for review before deployment
        uses: actions/upload-artifact@v4
        with:
          name: verified-hk-raw-history
          path: data_snapshots/hk_market_daily.json
          if-no-files-found: error


      - name: Collect all available verified FRED history for the same review
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/sync_fred_verified_cache.py
      - name: Preserve verified source snapshots and per-series coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-fred-history
          path: |
            data_snapshots/fred_cache/
            fred_sync_health.json
          if-no-files-found: error

