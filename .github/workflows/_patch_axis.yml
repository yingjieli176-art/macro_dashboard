name: patch-axis
on:
  push:
    paths:
      - '.github/workflows/_patch_axis.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app.py
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _year_axis_config():\n    return dict(\n        type="date",\n        overlaying="x",\n        matches="x",\n        anchor="y",\n        side="top",\n        position=1,\n        showgrid=False,\n        showline=True,\n        linecolor="#9ca3af",\n        linewidth=1,\n        ticks="outside",\n        ticklen=4,\n        tickwidth=1,\n        tickcolor="#9ca3af",\n        showticklabels=True,\n        tickfont=dict(size=10 if compact_mode else 11),\n        tickformat="%Y",\n        dtick="M12",\n        ticklabelstandoff=4,\n        fixedrange=True,\n        automargin=False,\n        layer="above traces",\n    )'''
          new = '''def _year_axis_config(date_range):\n    start = pd.Timestamp(get_start_date(date_range)).normalize()\n    end = pd.Timestamp.today().normalize()\n    years = pd.date_range(start=start, end=end, freq="YS")\n    if len(years) == 0:\n        years = pd.DatetimeIndex([start])\n    return dict(\n        type="date", overlaying="x", anchor="y", side="top",\n        showgrid=False, showline=True, linecolor="#9ca3af", linewidth=1,\n        ticks="outside", ticklen=5, tickwidth=1, tickcolor="#9ca3af",\n        showticklabels=True, tickfont=dict(size=10 if compact_mode else 11),\n        tickmode="array", tickvals=years.tolist(),\n        ticktext=[str(d.year) for d in years],\n        fixedrange=True, automargin=False, layer="above traces",\n    )'''
          if old not in s:
              raise SystemExit('old year axis function not found')
          s = s.replace(old, new, 1)
          s = s.replace('xaxis2=_year_axis_config(),', 'xaxis2=_year_axis_config(date_range),')
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Fix upper year X-axis rendering'
          git push
