name: repair chart layout 3

"on": push

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Patch
        run: |
          sed -i 's/xanchor="left", x=0.02, xref="paper"/xanchor="left", x=0, xref="container"/g' app.py
          sed -i 's/xanchor="right", x=0.98, xref="paper"/xanchor="right", x=1, xref="container"/g' app.py
          sed -i 's/xaxis=dict(domain=\[0, 1\]/xaxis=dict(domain=[0.10, 0.90]/g' app.py
          sed -i 's/, entrywidthmode="pixels", entrywidth=145//' app.py
          sed -i 's/second_row_names=("ON RRP",), //' app.py
          sed -i 's/second_row_names=("10Y Real",), //' app.py
          sed -i 's/second_row_names=("2Y",), //' app.py
          sed -i 's/second_row_names=("Reserve Balances",), //' app.py
          sed -i 's/\.mini-description { min-height: 54px; box-sizing: border-box; }/.mini-description { height: 72px; min-height: 72px; max-height: 72px; box-sizing: border-box; overflow: hidden; }/' app.py
          sed -i 's/\.source-text { min-height: 34px; box-sizing: border-box; }/.source-text { height: 34px; min-height: 34px; max-height: 34px; box-sizing: border-box; overflow: hidden; }/' app.py
          python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f repair_trigger5.txt repair_trigger4.txt repair_trigger3.txt repair_trigger2.txt repair_trigger.txt
          git add -A
          rm -f .github/workflows/repair_charts.yml .github/workflows/repair2.yml .github/workflows/repair3.yml
          git add -A
          git commit -m "Fix chart row alignment and axis-side legends"
          git push origin main
