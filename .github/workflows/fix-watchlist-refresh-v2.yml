name: Fix watchlist refresh isolation v2
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''@st.cache_data(ttl=20, show_spinner=False)\ndef _get_watchlist_quote(symbol):\n    if str(symbol).upper().endswith((".SS", ".SZ", ".HK")) or str(symbol).upper() in ("^HSI", "^HSTECH"):\n        row = _get_eastmoney_quote_safe(symbol)\n        if row.get("price") is not None: return row\n    return _get_yahoo_quote_safe(symbol)\n\ndef _refresh_quote_cache():\n    # Refresh ONLY the user-added stock modules. The top market index cards\n    # use a separate cache and are never invalidated by this button.\n    _get_watchlist_quote.clear()'''
          new = '''@st.cache_data(ttl=20, show_spinner=False)\ndef _get_watchlist_quote(symbol, refresh_key=0):\n    if str(symbol).upper().endswith((".SS", ".SZ", ".HK")) or str(symbol).upper() in ("^HSI", "^HSTECH"):\n        row = _get_eastmoney_quote_safe(symbol)\n        if row.get("price") is not None: return row\n    return _get_yahoo_quote_safe(symbol)\n\ndef _refresh_quote_cache():\n    # Only change the watchlist-local refresh key. Never clear any global/top-market cache.\n    st.session_state["_watchlist_refresh_key"] = st.session_state.get("_watchlist_refresh_key", 0) + 1'''
          if old not in s:
              raise SystemExit('watchlist cache block not found')
          s = s.replace(old, new, 1)
          old2 = 'def _render_quote_block(item):\n    row = _get_watchlist_quote(item["symbol"])'
          new2 = 'def _render_quote_block(item):\n    refresh_key = st.session_state.get("_watchlist_refresh_key", 0)\n    row = _get_watchlist_quote(item["symbol"], refresh_key)'
          if old2 not in s:
              raise SystemExit('render quote call not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Fix watchlist refresh without clearing market cache"
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/fix-watchlist-refresh-v2.yml
          git add .github/workflows/fix-watchlist-refresh-v2.yml
          git commit -m "Remove temporary refresh patch workflow"
          git push
