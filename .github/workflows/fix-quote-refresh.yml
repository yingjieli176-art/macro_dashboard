name: fix-quote-refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    st.rerun()\n\n@st.fragment(run_every="300s")', '\n@st.fragment(run_every="300s")', 1)
          old = '''def _eastmoney_secid(symbol):\n    raw = str(symbol or "").upper().strip()\n    if raw.endswith(".HK"): return f"116.{raw[:-3].zfill(5)}"\n    if raw.endswith(".SS"): return f"1.{raw[:-3]}"\n    if raw.endswith(".SZ"): return f"0.{raw[:-3]}"\n    return ""'''
          new = '''def _eastmoney_secid(symbol):\n    raw = str(symbol or "").upper().strip()\n    if raw == "^HSI": return "100.HSI"\n    if raw in ("HSTECH.HK", "^HSTECH"): return "100.HSTECH"\n    if raw.endswith(".HK"): return f"116.{raw[:-3].zfill(5)}"\n    if raw.endswith(".SS"): return f"1.{raw[:-3]}"\n    if raw.endswith(".SZ"): return f"0.{raw[:-3]}"\n    return ""'''
          if old in s: s = s.replace(old, new, 1)
          s = s.replace('if str(symbol).upper().endswith((".SS", ".SZ", ".HK")):', 'if str(symbol).upper().endswith((".SS", ".SZ", ".HK")) or str(symbol).upper() in ("^HSI", "^HSTECH"):', 1)
          old = '        price = float(price_raw) / 100; previous = None if prev_raw in (None, "-", "") else float(prev_raw) / 100'
          new = '        divisor = 1 if str(symbol).upper() in ("^HSI", "HSTECH.HK", "^HSTECH", "000001.SS", "399001.SZ", "000300.SS") else 100\n        price = float(price_raw) / divisor; previous = None if prev_raw in (None, "-", "") else float(prev_raw) / divisor'
          if old in s: s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Fix quote refresh callback and index quote scaling"
          git push
      - name: Remove workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-quote-refresh.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove quote refresh patch workflow" || true
          git push || true
