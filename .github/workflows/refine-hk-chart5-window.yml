name: Refine HK chart 5 publication window

on:
  push:
    branches: [main]
    paths:
      - scripts/refine_hk_chart5_window.py
      - .github/workflows/refine-hk-chart5-window.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply publication-window refinement
        run: python scripts/refine_hk_chart5_window.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Commit app.py
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Refine Hong Kong liquidity chart window"
          git push
