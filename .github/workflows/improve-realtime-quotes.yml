name: Improve realtime quotes

on:
  push:
    branches: [main]
    paths:
      - scripts/improve_realtime_quotes.py
      - .github/workflows/improve-realtime-quotes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply quote freshness fix
        run: python scripts/improve_realtime_quotes.py
      - name: Compile app
        run: python -m py_compile app.py data.py
      - name: Validate quote pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'TENCENT_MINUTE_URL',
              'DIRECT_QUOTE_FRESH_SECONDS = 90',
              'def _get_tencent_minute_quote_safe',
              '@st.cache_data(ttl=15, show_spinner=False)\ndef _get_cached_quote',
              'def _quote_refresh_key(): return int(time.time() // 15)',
              '@st.fragment(run_every="15s")\ndef render_market_overview',
              '@st.fragment(run_every="15s")\ndef render_watchlists',
              '近实时',
          ]
          missing = [x for x in required if x not in text]
          assert not missing, missing
          print('Realtime quote pipeline validation OK')
          PY
      - name: Probe live HK/A endpoints
        continue-on-error: true
        run: |
          python - <<'PY'
          import time, requests
          samples = [('hk00700', 'Tencent HK'), ('sh600519', 'Tencent A')]
          for code, label in samples:
              r = requests.get(
                  f'https://qt.gtimg.cn/q={code}&_={int(time.time()*1000)}',
                  headers={'User-Agent':'Mozilla/5.0','Referer':'https://finance.qq.com/','Cache-Control':'no-cache'},
                  timeout=5,
              )
              raw = r.content.decode('gbk', errors='ignore')
              fields = raw.split('~')
              print(label, 'status=', r.status_code, 'price=', fields[3] if len(fields)>32 else 'NA', 'time=', fields[30] if len(fields)>32 else 'NA')
          PY
      - name: Commit production change
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Improve HK and A-share quote freshness"
          git pull --rebase origin main
          git push origin main
