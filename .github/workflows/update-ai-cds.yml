name: Refresh public AI company CDS aggregates
on:
  # Scheduled collection is owned by update-us-sources.yml.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-ai-cds-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas plotly requests
      - name: Validate and refresh attributed CDS observations
        run: python scripts/update_ai_cds_snapshot.py
      - name: Commit observation snapshot only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/ai_cds_daily.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'data: refresh public AI company CDS history'
          bash scripts/push_snapshot.sh
