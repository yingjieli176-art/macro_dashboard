name: Japan corridor source and layout regression
on:
  pull_request:
    branches: [main]
    paths:
      - app.py
      - macro_platform/japan_corridor.py
      - macro_platform/dashboard_layout.py
      - macro_platform/freshness_overview.py
      - macro_platform/parameter_guide.py
      - scripts/update_japan_corridor.py
      - tests/test_japan_corridor.py
      - .github/workflows/japan-corridor-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  japan-corridor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify exact source definitions, policy effective dates and 21-chart app
        run: python -m pytest tests/test_japan_corridor.py tests/test_app_runtime_smoke.py tests/test_full_freshness.py tests/test_dashboard_loading.py tests/test_consolidated_runtime.py tests/test_maintenance_workflows.py tests/test_chart_render_safety.py tests/test_echarts_axes.py tests/test_series_calendars.py -q --junitxml=japan-corridor-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-corridor-regression
          path: japan-corridor-tests.xml
