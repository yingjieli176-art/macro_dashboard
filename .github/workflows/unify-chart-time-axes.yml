name: Unify chart time axes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - macro_platform/chart_axes.py
      - app.py
      - macro_platform/hk_liquidity.py
      - .github/workflows/unify-chart-time-axes.yml

permissions:
  contents: read

concurrency:
  group: unify-chart-time-axes
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pandas plotly requests
      - name: Compile application
        run: python -m py_compile app.py macro_platform/hk_liquidity.py macro_platform/chart_axes.py
      - name: Validate visible year bands and adaptive lower axis
        run: |
          python - <<'PY'
          import pandas as pd
          import plotly.graph_objects as go
          from macro_platform.chart_axes import (
              YEAR_BAND_SHAPE_NAME,
              YEAR_DIVIDER_SHAPE_NAME,
              apply_time_axis,
          )
          from macro_platform.hk_liquidity import build_hk_liquidity_figures

          expected = {
              '5Y': ('M12', '%Y'),
              '1Y': ('M2', '%m月'),
              '6M': ('M1', '%m月'),
              '3M': (14 * 24 * 60 * 60 * 1000, '%m-%d'),
              '1M': (5 * 24 * 60 * 60 * 1000, '%m-%d'),
          }
          dates = pd.date_range('2021-01-01', '2026-09-09', freq='D')
          for date_range, (dtick, tickformat) in expected.items():
              fig = go.Figure(go.Scatter(x=dates, y=list(range(len(dates)))))
              apply_time_axis(fig, date_range)
              assert fig.layout.xaxis.dtick == dtick, (date_range, fig.layout.xaxis.dtick)
              assert fig.layout.xaxis.tickformat == tickformat
              assert fig.layout.xaxis.tickmode == 'array'
              assert fig.layout.xaxis.tickangle == 0
              assert fig.layout.xaxis2.visible is False
              tickvals = list(fig.layout.xaxis.tickvals or [])
              assert tickvals, date_range
              assert pd.Timestamp(tickvals[-1]) < dates.max(), (date_range, tickvals[-1], dates.max())
              if date_range == '5Y':
                  assert len(tickvals) <= 6, tickvals
                  assert all(pd.Timestamp(v).month == 1 and pd.Timestamp(v).day == 1 for v in tickvals)
              bands = [s for s in fig.layout.shapes if getattr(s, 'name', None) == YEAR_BAND_SHAPE_NAME]
              dividers = [s for s in fig.layout.shapes if getattr(s, 'name', None) == YEAR_DIVIDER_SHAPE_NAME]
              year_labels = [a for a in fig.layout.annotations if str(getattr(a, 'text', '')).startswith('<b>') and getattr(a, 'yref', None) == 'paper']
              assert bands, date_range
              assert year_labels, date_range
              assert len(dividers) == max(0, len(bands) - 1), (date_range, len(bands), len(dividers))
              assert all(float(s.line.width or 0) == 0 for s in bands), date_range
              assert all(s.line.dash == 'dot' for s in dividers), date_range
              assert all(float(s.y0) == 0.0 and float(s.y1) == 1.0 for s in dividers), date_range
              if date_range == '1M':
                  assert len(bands) == 1, len(bands)
                  assert len(year_labels) == 1, len(year_labels)
                  assert len(dividers) == 0, len(dividers)
              print(date_range, 'ticks=', [str(v) for v in tickvals], 'bands=', len(bands), 'dividers=', len(dividers), 'labels=', [a.text for a in year_labels])

          # Real Hong Kong charts 5-8 must use the same temporal guides.
          figures = build_hk_liquidity_figures('5Y')
          assert len(figures) == 4
          for i, fig in enumerate(figures, start=5):
              bands = [s for s in fig.layout.shapes if getattr(s, 'name', None) == YEAR_BAND_SHAPE_NAME]
              dividers = [s for s in fig.layout.shapes if getattr(s, 'name', None) == YEAR_DIVIDER_SHAPE_NAME]
              labels = [a for a in fig.layout.annotations if str(getattr(a, 'text', '')).startswith('<b>') and getattr(a, 'yref', None) == 'paper']
              assert bands, i
              assert labels, i
              assert len(dividers) == max(0, len(bands) - 1), (i, len(bands), len(dividers))
              assert fig.layout.xaxis2.visible is False, i
              assert fig.layout.xaxis.tickmode == 'array', i
              assert fig.layout.legend.y >= 1.15, (i, fig.layout.legend.y)
              # Re-applying a short range must replace, not duplicate, year cells/dividers.
              apply_time_axis(fig, '1M')
              short_bands = [s for s in fig.layout.shapes if getattr(s, 'name', None) == YEAR_BAND_SHAPE_NAME]
              short_dividers = [s for s in fig.layout.shapes if getattr(s, 'name', None) == YEAR_DIVIDER_SHAPE_NAME]
              short_labels = [a for a in fig.layout.annotations if str(getattr(a, 'text', '')).startswith('<b>') and getattr(a, 'yref', None) == 'paper']
              assert len(short_bands) == 1, (i, len(short_bands))
              assert len(short_dividers) == 0, (i, len(short_dividers))
              assert len(short_labels) == 1, (i, len(short_labels))
              print('chart', i, '1M year=', short_labels[0].text)
          PY
      - name: Validate shared axis wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          hk = Path('macro_platform/hk_liquidity.py').read_text(encoding='utf-8')
          axes = Path('macro_platform/chart_axes.py').read_text(encoding='utf-8')
          assert 'from macro_platform.chart_axes import apply_time_axis' in app
          assert 'from macro_platform.chart_axes import apply_time_axis' in hk
          assert 'return apply_time_axis(fig, date_range)' in app
          assert 'return apply_time_axis(fig, date_range)' in hk
          assert 'YEAR_DIVIDER_SHAPE_NAME' in axes
          assert 'tickmode="array"' in axes
          assert 'rgba(243,244,246,0.34)' in axes
          assert 'dash="dot"' in axes
          print('shared deterministic time-axis and soft year-band wiring present')
          PY
