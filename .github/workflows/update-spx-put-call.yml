name: Refresh official SPX put-call volume history
on:
  schedule:
    - cron: '53 0-6,12,22 * * *'
  workflow_dispatch:
  push:
    branches: [main, codex/vix-ratios-spx-cds-r92]
    paths:
      - scripts/update_spx_put_call_snapshot.py
      - macro_platform/spx_options.py
      - scripts/audit_source_freshness.py
      - .github/workflows/update-spx-put-call.yml
permissions:
  contents: write
concurrency:
  group: spx-put-call-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests
      - name: Collect dated SPX plus SPXW volume reports
        run: python scripts/update_spx_put_call_snapshot.py
      - name: Commit verified observations only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/spx_put_call_daily.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh Cboe SPX put-call volume reports'
          if [ "$GITHUB_REF_NAME" = main ]; then
            bash scripts/push_snapshot.sh
          else
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Audit original dates
        run: |
          python -m pip install plotly
          python scripts/audit_source_freshness.py --only spx_put_call_daily.json
