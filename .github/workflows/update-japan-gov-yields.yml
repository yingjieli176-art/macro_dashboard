name: Refresh original Japanese government yields
on:
  schedule:
    - cron: '27 8-11 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_japan_gov_yields.py
      - .github/workflows/update-japan-gov-yields.yml
permissions:
  contents: write
concurrency:
  group: japan-official-yield-observations
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/update_japan_gov_yields.py
      - name: Commit original observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/japan_gov_yields.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: update original MOF JGB yields'
          bash scripts/push_snapshot.sh
