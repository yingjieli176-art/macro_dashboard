name: Probe HSTECH Investing metadata

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-hstech-investing.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Investing HSTECH metadata and history API
        run: |
          python - <<'PY'
          import json, re, urllib.request
          url = 'https://www.investing.com/indices/hang-seng-tech-historical-data'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'})
          with urllib.request.urlopen(req, timeout=20) as r:
              html = r.read().decode('utf-8','ignore')
          print('html_len', len(html))
          ids = []
          for pat in [r'"instrument_id"\s*:\s*"?(\d+)', r'"instrumentId"\s*:\s*"?(\d+)', r'"pair_ID"\s*:\s*"?(\d+)', r'"pairId"\s*:\s*"?(\d+)']:
              vals = re.findall(pat, html)
              print(pat, vals[:10])
              ids.extend(vals)
          for keyword in ['HSTECH','Hang Seng TECH','instrument_id','pair_ID','pairId']:
              pos=html.find(keyword)
              if pos>=0:
                  print('\nCTX', keyword, html[max(0,pos-500):pos+700].replace('\n',' ')[:1200])
          seen=[]
          for x in ids:
              if x not in seen: seen.append(x)
          print('candidate_ids', seen[:20])
          for iid in seen[:10]:
              api=f'https://api.investing.com/api/financialdata/historical/{iid}?start-date=2021-09-01&end-date=2026-09-09&time-frame=Monthly&add-missing-rows=false'
              req=urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0','domain-id':'www','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      body=r.read().decode('utf-8','ignore')
                  payload=json.loads(body)
                  rows=payload.get('data') or []
                  print('API', iid, 'rows',len(rows),'first',rows[:1],'last',rows[-1:] if rows else [])
              except Exception as e:
                  print('API',iid,'ERR',repr(e))
          PY
