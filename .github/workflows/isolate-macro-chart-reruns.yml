name: Isolate macro chart reruns

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/isolate_macro_chart_reruns.py
      - .github/workflows/isolate-macro-chart-reruns.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate macro chart reruns
        run: python scripts/isolate_macro_chart_reruns.py
      - name: Compile app
        run: python -m py_compile app.py
      - name: Validate fragment isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text()
          assert '@st.fragment\ndef render_core_charts():' in text
          assert text.count('@st.fragment(run_every="15s")') >= 2
          assert '@st.fragment(run_every="60s")' in text
          print('fragment isolation OK')
          PY
      - name: Commit production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Isolate macro chart widget reruns"
          git pull --rebase origin main
          git push origin main
