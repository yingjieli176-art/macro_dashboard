name: Refresh equity risk chart closes
on:
  # Scheduled collection is owned by update-us-sources.yml.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: equity-risk-official-closes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests
      - name: Refresh independent official feeds
        id: refresh
        continue-on-error: true
        run: python scripts/update_equity_risk_snapshot.py
      - name: Publish successful observations even if another feed failed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/vixeq_daily.json data_snapshots/cor3m_daily.json data_snapshots/fred_cache/VIXCLS.json data_snapshots/fred_cache/SP500.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh completed equity risk observations'
          bash scripts/push_snapshot.sh
      - name: Report source errors
        if: steps.refresh.outcome == 'failure'
        run: exit 1
