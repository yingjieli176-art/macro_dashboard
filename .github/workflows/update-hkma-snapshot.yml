name: Update HKMA data snapshot

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_hkma_snapshot.py
      - .github/workflows/update-hkma-snapshot.yml

permissions:
  contents: write

concurrency:
  group: hkma-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install snapshot dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Refresh HKMA snapshot
        id: refresh
        continue-on-error: true
        run: python scripts/update_hkma_snapshot.py

      - name: Validate last good snapshot
        run: |
          python -m py_compile macro_platform/hk_liquidity.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data_snapshots/hkma_monetary_statistics.json')
          data = json.loads(p.read_text())
          rows = data.get('records') or []
          assert len(rows) >= 60, f'no usable 5Y HKMA fallback snapshot: {len(rows)} rows'
          required = {
              'm2_hkd': 58,
              'm3_hkd': 58,
              'monetary_base_total': 60,
              'aggr_balance': 60,
          }
          for field, minimum in required.items():
              count = sum(r.get(field) is not None for r in rows)
              assert count >= minimum, f'{field} coverage too short: {count}'
          print('last good 5Y snapshot OK:', len(rows), 'records')
          PY

      - name: Report upstream availability
        if: steps.refresh.outcome != 'success'
        run: echo "HKMA upstream was unavailable from this runner; retaining the last good repository snapshot."

      - name: Commit refreshed snapshot
        if: steps.refresh.outcome == 'success'
        run: |
          git add data_snapshots/hkma_monetary_statistics.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh HKMA monetary statistics snapshot"
          git push
