name: Patch HK banking liquidity to monthly

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-hk-banking-monthly.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make banking liquidity monthly-only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('macro_platform/hk_liquidity.py')
          text = path.read_text(encoding='utf-8')

          source_line = '    banking_source = load_hk_banking_liquidity_monthly() if date_range == "5Y" else load_hk_banking_liquidity_daily()\n'
          replacement = (
              '    # Banking-system structure is intentionally monthly. Daily detail adds little\n'
              '    # to Aggregate Balance / EFBN trend analysis and created unnecessary snapshot\n'
              '    # fragility. HKD funding below remains daily where available.\n'
              '    banking_source = load_hk_banking_liquidity_monthly()\n'
          )
          if source_line not in text:
              raise SystemExit('banking source assignment not found')
          text = text.replace(source_line, replacement, 1)

          daily_flag = '    banking_is_daily = _frame_is_daily(banking_source)\n'
          text = text.replace(daily_flag, '', 1)
          text = text.replace(
              '    # 5-2 · Daily banking-system liquidity and monetary-base structure.\n',
              '    # 6 · Monthly banking-system liquidity and monetary-base structure.\n',
              1,
          )

          opening = '    add_line(balance, banking_data, "Opening Aggregate Balance", "Opening Aggregate Balance", "#64748b", 1.7, "dot", unit=" HK$ bn", secondary_y=False)\n'
          forecast = '    add_line(balance, banking_data, "Forecast Aggregate Balance T+1", "Forecast Aggregate Balance T+1", "#0284c7", 2.0, "dash", unit=" HK$ bn", secondary_y=False)\n'
          text = text.replace(opening, '', 1).replace(forecast, '', 1)

          start_token = '    banking_frequency_label = "Daily" if banking_is_daily else ("Monthly" if date_range == "5Y" else "Monthly fallback")\n'
          end_token = '    # 5-3 · HKD funding.\n'
          start = text.find(start_token)
          end = text.find(end_token, start)
          if start < 0 or end < 0:
              raise SystemExit('banking frequency/warning block not found')
          text = text[:start] + '    style(balance, "6. Banking-system Liquidity · Monthly", height=400, right_axis=True)\n\n' + text[end:]

          path.write_text(text, encoding='utf-8')
          print('HK banking liquidity chart is now monthly-only')
          PY
      - name: Syntax check
        run: python -m py_compile macro_platform/hk_liquidity.py app.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro_platform/hk_liquidity.py
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Use monthly HK banking liquidity series"
          git pull --rebase origin main
          git push origin main
