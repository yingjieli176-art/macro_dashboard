name: Build desktop workstation v1

on:
  push:
    branches: [main]
    paths:
      - scripts/build_desktop_workstation_v1.py
      - .github/workflows/build-desktop-workstation-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply desktop workstation
        run: python scripts/build_desktop_workstation_v1.py
      - name: Compile app
        run: python -m py_compile app.py data.py
      - name: Validate workstation
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'Macro Workstation',
              'DESKTOP TERMINAL',
              'workspace_global_range',
              'def render_signal_strip():',
              'workspace-news-rail',
              'RATES WORKSPACE',
              'HONG KONG WORKSPACE',
              'work-card-title',
              'Methodology · Sources',
          ]
          missing = [x for x in required if x not in text]
          assert not missing, missing
          forbidden = ['workstation_view_mode', 'MOBILE COMPACT', 'options=["电脑", "手机"]']
          present = [x for x in forbidden if x in text]
          assert not present, present
          print('Desktop workstation validation OK')
          PY
      - name: Commit production changes
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Build desktop macro workstation v1"
          git pull --rebase origin main
          git push origin main
