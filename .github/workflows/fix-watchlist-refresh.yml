name: fix-watchlist-refresh
on:
  push:
    paths:
      - '.github/workflows/fix-watchlist-refresh.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _quote_refresh_key():\n    bucket = int(time.time() // 300)\n    nonce = st.session_state.get("_quote_refresh_nonce", 0)\n    return f"{bucket}:{nonce}"\n'''
          new = '''def _quote_refresh_key():\n    return int(time.time() // 300)\n\ndef _watchlist_quote_refresh_key():\n    bucket = int(time.time() // 300)\n    nonce = st.session_state.get("_watchlist_quote_refresh_nonce", 0)\n    return f"{bucket}:{nonce}"\n'''
          if old not in s:
              raise SystemExit('quote_refresh_key pattern not found')
          s = s.replace(old, new, 1)
          old = '''def _refresh_quote_cache():\n    st.session_state["_quote_refresh_nonce"] = st.session_state.get("_quote_refresh_nonce", 0) + 1\n    _get_cached_quote.clear()\n    _get_yahoo_overnight_safe.clear()\n'''
          new = '''def _refresh_quote_cache():\n    # Only invalidate the user-added watchlist quotes. Keep the top market\n    # index cards cached so clicking refresh cannot break/reload them.\n    st.session_state["_watchlist_quote_refresh_nonce"] = st.session_state.get("_watchlist_quote_refresh_nonce", 0) + 1\n'''
          if old not in s:
              raise SystemExit('refresh callback pattern not found')
          s = s.replace(old, new, 1)
          old = '''row = _get_cached_quote(item["symbol"], _quote_refresh_key()); price, change = row.get("price"), row.get("change_pct")'''
          new = '''row = _get_cached_quote(item["symbol"], _watchlist_quote_refresh_key()); price, change = row.get("price"), row.get("change_pct")'''
          if old not in s:
              raise SystemExit('watchlist quote call pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit app.py and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Isolate watchlist quote refresh' || exit 0
          git rm .github/workflows/fix-watchlist-refresh.yml
          git commit -m 'Remove one-off refresh patch workflow'
          git push
