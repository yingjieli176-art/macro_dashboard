name: repair chart layout 2

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python -c 'from pathlib import Path; p=Path("app.py"); s=p.read_text(encoding="utf-8"); old="        legend=dict(orientation=\\"h\\", yanchor=\\"bottom\\", y=1.20, xanchor=\\"left\\", x=0.02, xref=\\"paper\\", font=dict(size=10), bgcolor=\\"rgba(255,255,255,0)\\", traceorder=\\"normal\\", entrywidthmode=\\"pixels\\", entrywidth=145),\\n        legend2=dict(orientation=\\"h\\", yanchor=\\"bottom\\", y=1.20, xanchor=\\"right\\", x=0.98, xref=\\"paper\\", font=dict(size=10), bgcolor=\\"rgba(255,255,255,0)\\", traceorder=\\"normal\\", entrywidthmode=\\"pixels\\", entrywidth=145),\\n        legend3=dict(orientation=\\"h\\", yanchor=\\"bottom\\", y=1.105, xanchor=\\"left\\", x=0.02, xref=\\"paper\\", font=dict(size=10), bgcolor=\\"rgba(255,255,255,0)\\", traceorder=\\"normal\\", entrywidthmode=\\"pixels\\", entrywidth=145),\\n        xaxis=dict(domain=[0, 1], fixedrange=True, automargin=False),"; new="        legend=dict(orientation=\\"h\\", yanchor=\\"bottom\\", y=1.20, xanchor=\\"left\\", x=0, xref=\\"container\\", font=dict(size=10), bgcolor=\\"rgba(255,255,255,0)\\", traceorder=\\"normal\\"),\\n        legend2=dict(orientation=\\"h\\", yanchor=\\"bottom\\", y=1.20, xanchor=\\"right\\", x=1, xref=\\"container\\", font=dict(size=10), bgcolor=\\"rgba(255,255,255,0)\\", traceorder=\\"normal\\"),\\n        xaxis=dict(domain=[0.10, 0.90], fixedrange=True, automargin=False),"; assert old in s; s=s.replace(old,new,1); s=s.replace(".mini-description { min-height: 54px; box-sizing: border-box; }\\n.source-text { min-height: 34px; box-sizing: border-box; }", ".mini-description { height: 72px; min-height: 72px; max-height: 72px; box-sizing: border-box; overflow: hidden; }\\n.source-text { height: 34px; min-height: 34px; max-height: 34px; box-sizing: border-box; overflow: hidden; }"); s=s.replace("def _finalize_chart(fig, right_names=(), second_row_names=(), right_title=None, left_title=None):", "def _finalize_chart(fig, right_names=(), right_title=None, left_title=None):"); old="        xaxis=dict(domain=[0, 1], fixedrange=True, automargin=False, showgrid=False, showline=True, linecolor=\\"#d1d5db\\", hoverformat=\\"%Y-%m-%d\\"),\\n        legend=dict(orientation=\\"h\\", yanchor=\\"bottom\\", y=1.20, xanchor=\\"left\\", x=0.02, xref=\\"paper\\", font=dict(size=10), bgcolor=\\"rgba(255,255,255,0)\\", entrywidthmode=\\"pixels\\", entrywidth=145),\\n        legend2=dict(orientation=\\"h\\", yanchor=\\"bottom\\", y=1.20, xanchor=\\"right\\", x=0.98, xref=\\"paper\\", font=dict(size=10), bgcolor=\\"rgba(255,255,255,0)\\", entrywidthmode=\\"pixels\\", entrywidth=145),\\n        legend3=dict(orientation=\\"h\\", yanchor=\\"bottom\\", y=1.105, xanchor=\\"left\\", x=0.02, xref=\\"paper\\", font=dict(size=10), bgcolor=\\"rgba(255,255,255,0)\\", entrywidthmode=\\"pixels\\", entrywidth=145),"; new="        xaxis=dict(domain=[0.10, 0.90], fixedrange=True, automargin=False, showgrid=False, showline=True, linecolor=\\"#d1d5db\\", hoverformat=\\"%Y-%m-%d\\"),\\n        legend=dict(orientation=\\"h\\", yanchor=\\"bottom\\", y=1.20, xanchor=\\"left\\", x=0, xref=\\"container\\", font=dict(size=10), bgcolor=\\"rgba(255,255,255,0)\\", traceorder=\\"normal\\"),\\n        legend2=dict(orientation=\\"h\\", yanchor=\\"bottom\\", y=1.20, xanchor=\\"right\\", x=1, xref=\\"container\\", font=dict(size=10), bgcolor=\\"rgba(255,255,255,0)\\", traceorder=\\"normal\\"),"; assert old in s; s=s.replace(old,new,1); old="    right_names = set(right_names)\\n    second_row_names = set(second_row_names)\\n    for trace in fig.data:\\n        name = getattr(trace, \\"name\\", None)\\n        if getattr(trace, \\"yaxis\\", \\"y\\") == \\"y2\\" or name in right_names:\\n            trace.legend = \\"legend2\\"\\n        elif name in second_row_names:\\n            trace.legend = \\"legend3\\"\\n        else:\\n            trace.legend = \\"legend\\"\\n    return fig"; new="    right_names = set(right_names)\\n    for trace in fig.data:\\n        name = getattr(trace, \\"name\\", None)\\n        if getattr(trace, \\"yaxis\\", \\"y\\") == \\"y2\\" or name in right_names:\\n            trace.legend = \\"legend2\\"\\n        else:\\n            trace.legend = \\"legend\\"\\n    return fig"; assert old in s; s=s.replace(old,new,1); s=s.replace("second_row_names=(\\\"ON RRP\\\",), ",""); s=s.replace("second_row_names=(\\\"10Y Real\\\",), ",""); s=s.replace("second_row_names=(\\\"2Y\\\",), ",""); s=s.replace("second_row_names=(\\\"Reserve Balances\\\",), ",""); p.write_text(s,encoding="utf-8")'
          python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f repair_trigger.txt
          git add app.py repair_trigger.txt
          git rm .github/workflows/repair2.yml
          git commit -m "Fix chart row alignment and axis-side legends"
          git push
