name: Update HKMA monetary base history

on:
  schedule:
    - cron: '35 22 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_hkma_monetary_base_history.py
      - .github/workflows/update-hkma-monetary-base-history.yml

permissions:
  contents: write

concurrency:
  group: hkma-monetary-statistics-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas plotly
      - name: Refresh official HKMA monetary-base history
        run: python scripts/update_hkma_monetary_base_history.py
      - name: Validate 5Y monetary base and aggregate balance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import date
          p=json.loads(Path('data_snapshots/hkma_monetary_statistics.json').read_text())
          latest=max(r['end_of_month'] for r in p['records'])
          cutoff=f'{int(latest[:4])-5:04d}{latest[4:]}'
          for col in ('monetary_base_total','aggr_balance'):
              rows=[r for r in p['records'] if r['end_of_month'] >= cutoff and r.get(col) is not None]
              assert len(rows)>=58, (col,len(rows))
              print(col,len(rows),max(r['end_of_month'] for r in rows))
          PY
      - name: Commit refreshed official history
        run: |
          git add data_snapshots/hkma_monetary_statistics.json
          if git diff --cached --quiet; then
            echo "HKMA monetary-base history unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh five-year HKMA monetary-base history"
          bash scripts/push_snapshot.sh
