name: Update HSTECH snapshot

on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_hstech_snapshot.py
      - scripts/apply_hk_freshness_v3.py
      - .github/workflows/update-hstech-snapshot.yml

permissions:
  contents: write

concurrency:
  group: hstech-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install snapshot dependencies
        run: pip install akshare pandas plotly requests
      - name: Refresh exact HSTECH history
        run: python scripts/update_hstech_snapshot.py
      - name: Validate Python
        run: python -m py_compile macro_platform/hk_liquidity.py scripts/update_hstech_snapshot.py scripts/apply_hk_freshness_v3.py
      - name: Validate rolling five-year HSTECH coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          d=json.loads(Path('data_snapshots/hstech_monthly.json').read_text())
          rows=d['records']
          now=pd.Timestamp.now().normalize()
          assert len(rows)>=60
          assert pd.Timestamp(rows[0]['observation_date']) <= now-pd.DateOffset(years=4,months=10)
          assert pd.Timestamp(rows[-1]['observation_date']) >= now-pd.DateOffset(months=2)
          print('HSTECH observations', len(rows),d['coverage_end'])
          PY
      - name: Commit refreshed platform data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_snapshots/hstech_monthly.json
          if git diff --cached --quiet; then
            echo "HSTECH snapshot and wiring unchanged"
            exit 0
          fi
          git commit -m "Add exact HSTECH five-year history"
          bash scripts/push_snapshot.sh
