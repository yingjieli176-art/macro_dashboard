name: Update HSTECH snapshot

on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_hstech_snapshot.py
      - .github/workflows/update-hstech-snapshot.yml

permissions:
  contents: write

concurrency:
  group: hstech-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install snapshot dependencies
        run: pip install akshare pandas
      - name: Refresh exact HSTECH history
        run: python scripts/update_hstech_snapshot.py
      - name: Validate five-year HSTECH coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data_snapshots/hstech_monthly.json').read_text())
          rows=data.get('records') or []
          assert data.get('symbol')=='HSTECH'
          assert len(rows)>=60, len(rows)
          assert rows[0]['observation_date'] <= '2021-09-01', rows[0]
          assert rows[-1]['observation_date'] >= '2026-08-01', rows[-1]
          print('HSTECH snapshot OK',len(rows),rows[0],rows[-1])
          PY
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- data_snapshots/hstech_monthly.json; then
            echo "HSTECH snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_snapshots/hstech_monthly.json
          git commit -m "Refresh HSTECH five-year snapshot"
          git pull --rebase origin main
          git push origin main
