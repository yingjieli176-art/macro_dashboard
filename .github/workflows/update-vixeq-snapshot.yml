name: Refresh official Cboe VIXEQ
on:
  schedule:
    - cron: '40 23 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_vixeq_snapshot.py
      - .github/workflows/update-vixeq-snapshot.yml

permissions:
  contents: write

concurrency:
  group: official-cboe-vixeq-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Cboe fetch dependencies
        run: python -m pip install pandas requests
      - name: Refresh original VIXEQ data (keep prior if unavailable)
        run: python scripts/update_vixeq_snapshot.py
      - name: Verify observations have authentic dates and positive values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o = json.loads(Path('data_snapshots/vixeq_daily.json').read_text())
          records = o["records"]
          assert len(records) >= 200
          assert all(r["close"] > 0 for r in records)
          assert o["coverage_end"] == records[-1]["observation_date"]
          print(o["coverage_end"], len(records), o["source"])
          PY
      - name: Commit verified VIXEQ observations only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/vixeq_daily.json
          if git diff --cached --quiet; then
            echo 'Official VIXEQ history unchanged'
            exit 0
          fi
          git commit -m 'data: update official Cboe VIXEQ observations'
          git pull --rebase origin main
          git push origin main
