name: Probe old C&SD money table layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-censtat-old-money-layout.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pdfplumber
      - name: Locate old adjusted money tables
        run: |
          python - <<'PY'
          import io,re,requests,pdfplumber
          for issue in ['2022MM10','2022MM12','2023MM12']:
              url=f'https://www.censtatd.gov.hk/en/data/stat_report/product/B1010002/att/B1010002{issue}B0100.pdf'
              r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=40); r.raise_for_status()
              print('\n===== ISSUE',issue,'=====',len(r.content))
              with pdfplumber.open(io.BytesIO(r.content)) as pdf:
                  hits=[]
                  for i,p in enumerate(pdf.pages):
                      text=p.extract_text() or ''
                      norm=re.sub(r'\s+',' ',text).lower()
                      if ('swap deposit' in norm or '掉期存款' in text) and ('m2' in norm or 'money supply' in norm):
                          if i < 20: continue
                          print('\nPAGE',i+1,'\n',text[:8500])
                          hits.append(i+1)
                  print('hits',hits)
          PY
