name: Apply liquidity axes and precious metals chart

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_precious_metals_and_liquidity_axes.py
      - .github/workflows/apply-precious-metals-and-liquidity-axes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply dashboard changes
        run: python scripts/apply_precious_metals_and_liquidity_axes.py
      - name: Compile app
        run: python -m py_compile app.py data.py
      - name: Validate chart definitions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          required = [
              'def build_fig10(date_range, market_mode="Rebased 100"):',
              'Net Liquidity (L) · Reserve Balances / TGA (R1) · ON RRP (R2)',
              'R2 · ON RRP · USD B',
              '10. Precious Metals',
              'GoldSilverRatio',
              'GVZCLS',
              'precious_metals_mode',
          ]
          missing = [item for item in required if item not in text]
          assert not missing, missing
          print('Chart 4/10 validation OK')
          PY
      - name: Commit production changes
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Improve US liquidity axes and add precious metals chart"
          git pull --rebase origin main
          git push origin main
