name: Split Hong Kong parameter descriptions

on:
  push:
    branches: [main]
    paths:
      - scripts/split_hk_parameter_descriptions.py
      - .github/workflows/split-hk-parameter-descriptions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Apply per-chart explanations
        run: python scripts/split_hk_parameter_descriptions.py
      - name: Validate Python
        run: python -m py_compile app.py macro_platform/hk_liquidity.py
      - name: Validate Chart 5 explanation structure
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text()
          assert 'HK_PARAMETER_DESCRIPTIONS = [' in text
          assert 'show_hk_parameter_description(hk_index)' in text
          assert 'show_parameter_description(4)' not in text.split('def render_core_charts():', 1)[1]
          for term in [
              '1. HKD M2 MoM',
              '1. Aggregate Balance',
              '1. O/N HIBOR',
              '4. O/N−3M Spread（R）',
              '1. USD/HKD',
              '3. Weak-side CU 7.85',
          ]:
              assert term in text, term
          print('per-chart explanation validation OK')
          PY
      - name: Validate numbered Hong Kong figures
        run: |
          python - <<'PY'
          from macro_platform.hk_liquidity import build_hk_liquidity_figures
          figures = build_hk_liquidity_figures('1Y')
          assert len(figures) == 4
          expected = ['5-1.', '5-2.', '5-3.', '5-4.']
          for prefix, fig in zip(expected, figures):
              title = fig.layout.title.text or ''
              assert title.startswith(prefix), (prefix, title)
          print('Chart 5 numbering validation OK')
          PY
      - name: Commit migrated files
        run: |
          if git diff --quiet -- app.py macro_platform/hk_liquidity.py; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py macro_platform/hk_liquidity.py
          git commit -m "Split Chart 5 parameter explanations by figure"
          git push
