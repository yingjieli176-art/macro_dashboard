name: Tighten crypto chart axes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/tighten_crypto_chart_axes.py
      - .github/workflows/tighten-crypto-chart-axes.yml

permissions:
  contents: write

concurrency:
  group: tighten-crypto-chart-axes
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply crypto chart spacing fix
        run: python scripts/tighten_crypto_chart_axes.py
      - name: Compile app
        run: python -m py_compile app.py
      - name: Validate compact crypto axes
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text()
          for needle in (
              'ETH/BTC (R1)',
              'BTC 30D Realized Vol (R2)',
              'margin=dict(l=62, r=92, t=72, b=34, pad=2)',
              'xaxis=dict(domain=[0.0, 0.91])',
              'ETH (R1)',
              'ETH/BTC (R2)',
              'BTC 30D Realized Vol (R3)',
              'margin=dict(l=72, r=132, t=72, b=34, pad=2)',
          ):
              assert needle in text, needle
          print('crypto axis spacing OK')
          PY
      - name: Commit production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No production changes"
            exit 0
          fi
          git commit -m "Tighten crypto chart right axes"
          git pull --rebase origin main
          git push origin main
