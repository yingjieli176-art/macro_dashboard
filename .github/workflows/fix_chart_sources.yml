name: Fix chart sources

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[chart-source-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart data and source labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old = 'add_line(fig, data, "T10Y2Y", "10Y−2Y", 2.2, "dot", "y2", " bp"); add_line(fig, data, "T10Y3M", "10Y−3M", 2.2, "dash", "y2", " bp")'
          new = 'data["T10Y2Y_bp"] = data["T10Y2Y"] * 100.0; data["T10Y3M_bp"] = data["T10Y3M"] * 100.0; add_line(fig, data, "T10Y2Y_bp", "10Y−2Y", 2.2, "dot", "y2", " bp"); add_line(fig, data, "T10Y3M_bp", "10Y−3M", 2.2, "dash", "y2", " bp")'
          if old not in s:
              raise SystemExit('Chart 3 target not found')
          s = s.replace(old, new, 1)

          replacements = {
            '("DGS10", "https://fred.stlouisfed.org/series/DGS10")': '("10Y Nominal (DGS10)", "https://fred.stlouisfed.org/series/DGS10")',
            '("DFII10", "https://fred.stlouisfed.org/series/DFII10")': '("10Y Real (DFII10)", "https://fred.stlouisfed.org/series/DFII10")',
            '("T10YIE", "https://fred.stlouisfed.org/series/T10YIE")': '("10Y Breakeven (T10YIE)", "https://fred.stlouisfed.org/series/T10YIE")',
            '("DGS3MO", "https://fred.stlouisfed.org/series/DGS3MO")': '("3M Treasury (DGS3MO)", "https://fred.stlouisfed.org/series/DGS3MO")',
            '("DGS2", "https://fred.stlouisfed.org/series/DGS2")': '("2Y Treasury (DGS2)", "https://fred.stlouisfed.org/series/DGS2")',
            '("T10Y2Y", "https://fred.stlouisfed.org/series/T10Y2Y")': '("10Y−2Y Spread (T10Y2Y)", "https://fred.stlouisfed.org/series/T10Y2Y")',
            '("T10Y3M", "https://fred.stlouisfed.org/series/T10Y3M")': '("10Y−3M Spread (T10Y3M)", "https://fred.stlouisfed.org/series/T10Y3M")',
            '<div class="compact-description">3M / 2Y / 10Y / Curve Spread</div>': '<div class="compact-description">3M / 2Y / 10Y / 10Y−2Y / 10Y−3M</div>',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m '[chart-source-patch] Fix spread units and source labels' || exit 0
          git push
