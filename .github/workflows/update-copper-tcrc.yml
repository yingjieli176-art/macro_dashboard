name: Update copper spot TC RC

on:
  schedule:
    - cron: '47 1,5,9 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_copper_tcrc.py
      - .github/workflows/update-copper-tcrc.yml

permissions:
  contents: write

concurrency:
  group: copper-tcrc-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests beautifulsoup4 plotly
      - name: Refresh explicit public index fixings
        run: python scripts/update_copper_tcrc.py
      - name: Publish good observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_snapshots/copper_tcrc_weekly.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh copper spot TC RC observations"
          bash scripts/push_snapshot.sh
      - name: Audit actual weekly dates
        run: python scripts/audit_source_freshness.py --only copper_tcrc_weekly.json
