name: Refresh official CSI index price history
on:
  schedule:
    - cron: '17 9,12,16,23 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - macro_platform/china_equity.py
      - scripts/update_china_equity_snapshot.py
      - .github/workflows/update-china-equity-snapshot.yml
permissions:
  contents: write
concurrency:
  group: china-equity-price-observations
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/update_china_equity_snapshot.py
      - name: Commit verified index closes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/china_equity_daily.json
          if git diff --cached --quiet; then
            echo 'Official CSI daily observations unchanged'
            exit 0
          fi
          git commit -m 'data: refresh official CSI index daily closes'
          bash scripts/push_snapshot.sh
