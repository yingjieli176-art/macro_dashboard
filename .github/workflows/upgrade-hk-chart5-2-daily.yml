name: Upgrade HK Chart 5-2 daily liquidity

on:
  push:
    paths:
      - "scripts/update_hkma_banking_liquidity_snapshot.py"
      - "scripts/upgrade_hk_chart5_2_daily.py"
      - ".github/workflows/upgrade-hk-chart5-2-daily.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install pandas plotly requests

      - name: Upgrade Chart 5-2
        run: python scripts/upgrade_hk_chart5_2_daily.py

      - name: Validate Python and fallback rendering
        run: |
          python -m py_compile app.py macro_platform/hk_liquidity.py scripts/update_hkma_banking_liquidity_snapshot.py scripts/upgrade_hk_chart5_2_daily.py
          python - <<'PY'
          import pandas as pd
          import macro_platform.hk_liquidity as hk
          hk._market_monthly_close = lambda symbol, label: pd.DataFrame(columns=["observation_date", label])
          daily = hk.load_hk_banking_liquidity_daily()
          assert not daily.empty
          figures = hk.build_hk_liquidity_figures("5Y")
          assert len(figures) == 4
          names = [trace.name for trace in figures[1].data]
          assert "Closing Aggregate Balance" in names, names
          assert "Daily Banking-system Liquidity" in figures[1].layout.title.text
          PY
          grep -q "Opening Aggregate Balance：每日开市" app.py
          grep -q "HKMA Daily Interbank Liquidity" app.py
          grep -q "Daily banking liquidity & EFBN" app.py

      - name: Commit dashboard upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py macro_platform/hk_liquidity.py
          if git diff --cached --quiet; then
            echo "No dashboard code changes to commit"
          else
            git commit -m "Upgrade HK banking liquidity chart to daily data"
            git push
          fi

      - name: Refresh HKMA daily banking liquidity snapshot
        continue-on-error: true
        run: python scripts/update_hkma_banking_liquidity_snapshot.py

      - name: Validate and commit snapshot when available
        run: |
          if [ ! -f data_snapshots/hkma_banking_liquidity_daily.json ]; then
            echo "Daily snapshot unavailable; dashboard keeps its monthly fallback."
            exit 0
          fi
          python - <<'PY'
          import pandas as pd
          import macro_platform.hk_liquidity as hk
          daily = hk.load_hk_banking_liquidity_daily()
          assert len(daily) >= 250, len(daily)
          for column in (
              "Opening Aggregate Balance",
              "Closing Aggregate Balance",
              "Forecast Aggregate Balance T+1",
              "Outstanding EFBN",
              "EFBN Held by Licensed Banks",
          ):
              assert daily[column].notna().sum() > 10, (column, daily[column].notna().sum())
          hk._market_monthly_close = lambda symbol, label: pd.DataFrame(columns=["observation_date", label])
          names = [trace.name for trace in hk.build_hk_liquidity_figures("5Y")[1].data]
          for name in (
              "Opening Aggregate Balance",
              "Closing Aggregate Balance",
              "Forecast Aggregate Balance T+1",
              "Outstanding EFBN (R)",
              "EFBN Held by Licensed Banks (R)",
          ):
              assert name in names, (name, names)
          print(daily.tail(3).to_string(index=False))
          PY
          git add data_snapshots/hkma_banking_liquidity_daily.json
          if git diff --cached --quiet; then
            echo "Daily snapshot unchanged"
          else
            git commit -m "Refresh HKMA daily banking liquidity snapshot"
            git push
          fi
