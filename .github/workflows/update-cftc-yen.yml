name: Refresh CFTC yen speculative positions
on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - macro_platform/cftc_yen.py
      - scripts/update_cftc_yen.py
      - .github/workflows/update-cftc-yen.yml
permissions:
  contents: write
concurrency:
  group: cftc-yen-observations
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests streamlit==1.64.0
      - run: python scripts/update_cftc_yen.py
      - name: Commit verified CFTC weekly observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/cftc_jpy_weekly.json
          if git diff --cached --quiet; then
            echo 'CFTC yen observations unchanged'
            exit 0
          fi
          git commit -m 'data: refresh CFTC yen noncommercial positions'
          bash scripts/push_snapshot.sh
