name: temporary-liquidity-labels
on:
  push:
    paths:
      - '.github/workflows/temp_liquidity_labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart 4 labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          s = s.replace('4. Federal Debt: Total & Holders', '4. US Liquidity')
          s = s.replace('Total Debt / Public / Fed / Foreign / Private', 'Fed Assets / Reserves / TGA / ON RRP / Net Liquidity')
          s = s.replace('("GFDEBTN", "https://fred.stlouisfed.org/series/GFDEBTN"), ("FYGFDPUN", "https://fred.stlouisfed.org/series/FYGFDPUN"), ("FDHBFRBN", "https://fred.stlouisfed.org/series/FDHBFRBN"), ("FDHBFIN", "https://fred.stlouisfed.org/series/FDHBFIN"), ("FDHBPIN", "https://fred.stlouisfed.org/series/FDHBPIN")', '("WALCL", "https://fred.stlouisfed.org/series/WALCL"), ("WRESBAL", "https://fred.stlouisfed.org/series/WRESBAL"), ("WTREGEN", "https://fred.stlouisfed.org/series/WTREGEN"), ("RRPONTSYD", "https://fred.stlouisfed.org/series/RRPONTSYD")')
          old = 'PARAM_DESCRIPTIONS = ["IORB（Interest on Reserve Balances）：美联储对存放在美联储的准备金余额支付的利率。ON RRP（Overnight Reverse Repurchase Agreement）：美联储隔夜逆回购工具的利率。EFFR（Effective Federal Funds Rate）：美国联邦基金市场的有效隔夜利率。SOFR（Secured Overnight Financing Rate）：以美国国债为抵押的隔夜融资利率。", "10Y Nominal：10年期美国国债名义收益率。10Y Real：10年期美国国债实际收益率，通常指10年期TIPS实际收益率。Breakeven：10年期盈亏平衡通胀率，即名义收益率与实际收益率之差。", "3M：3个月期美国国债收益率。2Y：2年期美国国债收益率。10Y：10年期美国国债收益率。10Y−2Y：10年期与2年期美国国债收益率之差。10Y−3M：10年期与3个月期美国国债收益率之差。", "Total Public Debt：美国联邦政府总公共债务。Debt Held by Public：公众持有的联邦债务。Federal Reserve：美联储持有的联邦债务。Foreign & International：外国及国际投资者持有的联邦债务。Private Investors：私人投资者持有的联邦债务。"]'
          new = 'PARAM_DESCRIPTIONS = ["IORB（Interest on Reserve Balances）：美联储对存放在美联储的准备金余额支付的利率。ON RRP（Overnight Reverse Repurchase Agreement）：美联储隔夜逆回购工具的利率。EFFR（Effective Federal Funds Rate）：美国联邦基金市场的有效隔夜利率。SOFR（Secured Overnight Financing Rate）：以美国国债为抵押的隔夜融资利率。", "10Y Nominal：10年期美国国债名义收益率。10Y Real：10年期美国国债实际收益率，通常指10年期TIPS实际收益率。Breakeven：10年期盈亏平衡通胀率，即名义收益率与实际收益率之差。", "3M：3个月期美国国债收益率。2Y：2年期美国国债收益率。10Y：10年期美国国债收益率。10Y−2Y：10年期与2年期美国国债收益率之差。10Y−3M：10年期与3个月期美国国债收益率之差。", "Fed Total Assets：美联储总资产。Reserve Balances：存款机构在美联储的准备金余额。TGA：美国财政部在美联储的总账户。ON RRP：隔夜逆回购余额。Net Liquidity Proxy：Fed Total Assets − TGA − ON RRP，用于观察流动性方向的代理指标，不是官方指标。"]'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Update liquidity chart labels' || exit 0
          git push
