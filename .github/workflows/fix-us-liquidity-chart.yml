name: Fix US liquidity chart units and proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fix_us_liquidity_chart.py
      - .github/workflows/fix-us-liquidity-chart.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply chart 4 fix
        run: python scripts/fix_us_liquidity_chart.py

      - name: Compile app
        run: python -m py_compile app.py data.py scripts/fix_us_liquidity_chart.py

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Fix US liquidity units and net-liquidity proxy"
          git pull --rebase origin main
          git push origin main
