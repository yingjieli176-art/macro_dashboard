name: live-time-fix
on:
  push:
    paths: ['.github/workflows/_live_time_fix.yml']
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          s = s.replace('def _quote_refresh_key(): return int(time.time() // 300)', 'def _quote_refresh_key(): return int(time.time() // 60)')
          marker = 'render_market_groups()\n\n@st.cache_data(ttl=20, show_spinner=False)'
          replacement = 'render_market_groups()\n\nst.caption(f"行情数据刷新时间：{time.strftime(\"%Y-%m-%d %H:%M:%S\", time.localtime())}")\n\n@st.cache_data(ttl=20, show_spinner=False)'
          s = s.replace(marker, replacement)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Fix live market refresh timestamp'
          git push
# trigger second run
