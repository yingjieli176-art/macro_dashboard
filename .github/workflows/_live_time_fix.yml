name: live-time-fix
on:
  push:
    paths: ['.github/workflows/_live_time_fix.yml']
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          s = s.replace('st.caption(f"行情数据刷新时间：{time.strftime(\\"%Y-%m-%d %H:%M:%S\\", time.localtime())}")', 'st.caption(f"行情数据刷新时间：{time.strftime(\'%Y-%m-%d %H:%M:%S\', time.localtime())}")')
          p.write_text(s)
          PY
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Fix live market timestamp syntax'
          git push
# syntax-fix trigger
