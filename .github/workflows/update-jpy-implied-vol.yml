name: Refresh Saxo JPY three-month ATM implied volatility
on:
  schedule:
    - cron: '17 13,16,20 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_jpy_implied_vol.py
      - macro_platform/jpy_implied_vol.py
      - .github/workflows/update-jpy-implied-vol.yml

permissions:
  contents: write

concurrency:
  group: saxo-jpy-three-month-atm-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source parser and snapshot validation dependencies
        run: python -m pip install pandas plotly requests lxml
      - name: Append verified Saxo report observation
        run: python scripts/update_jpy_implied_vol.py
      - name: Publish the data snapshot only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_snapshots/jpy_3m_atm_saxo.json
          if git diff --cached --quiet; then
            echo 'Saxo three-month ATM quote unchanged'
            exit 0
          fi
          git commit -m 'data: refresh dated Saxo JPY three-month ATM implied volatility'
          bash scripts/push_snapshot.sh
      - name: Check actual observation date
        run: python scripts/audit_source_freshness.py --only jpy_3m_atm_saxo.json
