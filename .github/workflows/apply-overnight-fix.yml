name: Apply Yahoo overnight fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          helper = '''def _get_yahoo_overnight_safe(symbol, previous=None):
              try:
                  response = requests.get("https://query1.finance.yahoo.com/v7/finance/quote", params={"symbols": symbol}, headers={"User-Agent": "Mozilla/5.0"}, timeout=2.5)
                  response.raise_for_status()
                  rows = ((response.json() or {}).get("quoteResponse") or {}).get("result") or []
                  if rows:
                      item = rows[0]
                      price = item.get("overnightMarketPrice")
                      pct = item.get("overnightChangePercent")
                      if price is not None:
                          if pct is None and previous not in (None, 0): pct = (price - previous) / previous * 100
                          return price, pct
              except Exception:
                  pass
              return None, None

          '''
          if 'def _get_yahoo_overnight_safe(' not in s:
              marker = 'def _get_yahoo_quote_safe(symbol):\n'
              if marker not in s: raise SystemExit('quote function marker missing')
              s = s.replace(marker, helper + marker, 1)

          old = '"overnight_price": post_price, "overnight_change_pct": post_change_pct'
          if old in s:
              s = s.replace(old, '"overnight_price": overnight_price, "overnight_change_pct": overnight_change_pct', 1)
              needle = '        row = _empty_quote(); row.update({'
              if needle not in s: raise SystemExit('quote row marker missing')
              s = s.replace(needle, '        overnight_price, overnight_change_pct = _get_yahoo_overnight_safe(symbol, previous)\n' + needle, 1)

          lines = s.splitlines()
          start = next((i for i, line in enumerate(lines) if line.startswith('    if item.get("market") == "US":')), None)
          if start is None: raise SystemExit('US render marker missing')
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('    source = row.get')), None)
          if end is None: raise SystemExit('US render end marker missing')
          new_block = [
              '    if item.get("market") == "US":',
              '        pp, pc = row.get("post_price"), row.get("post_change_pct"); pre_price, pre_change = row.get("pre_price"), row.get("pre_change_pct"); overnight_price, overnight_change = row.get("overnight_price"), row.get("overnight_change_pct")',
              '        market_state = row.get("market_state")',
              '        if market_state in ("POSTPOST", "CLOSED") and overnight_price is not None: after = f\'<div class="search-after">夜盘：<strong>{overnight_price:,.2f}</strong> <span>{"--" if overnight_change is None else f"{overnight_change:+.2f}%"}</span></div>\'',
              '        elif market_state in ("PRE", "PREPRE") and pre_price is not None: after = f\'<div class="search-after">盘前：<strong>{pre_price:,.2f}</strong> <span>{"--" if pre_change is None else f"{pre_change:+.2f}%"}</span></div>\'',
              '        elif market_state == "POST" and pp is not None: after = f\'<div class="search-after">盘后：<strong>{pp:,.2f}</strong> <span>{"--" if pc is None else f"{pc:+.2f}%"}</span></div>\'',
              '        elif pp is not None and row.get("post_market_time"): after = f\'<div class="search-after">最近盘后：<strong>{pp:,.2f}</strong> <span>{"--" if pc is None else f"{pc:+.2f}%"}</span></div>\'',
          ]
          lines[start:end] = new_block
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m py_compile app.py data.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git rm .github/workflows/apply-overnight-fix.yml
          git commit -m 'Use Yahoo overnightMarketPrice for US watchlist'
          git push origin main
