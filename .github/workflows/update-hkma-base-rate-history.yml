name: Update HKMA Base Rate history

on:
  schedule:
    - cron: '35 22 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_hkma_base_rate_history.py
      - .github/workflows/update-hkma-base-rate-history.yml

permissions:
  contents: write

concurrency:
  group: hkma-base-rate-history
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Refresh official Base Rate history
        run: python scripts/update_hkma_base_rate_history.py
      - name: Validate five-year Base Rate coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data_snapshots/hkma_base_rate_monthly.json').read_text())
          rows=p.get('records') or []
          assert len(rows)>=60, len(rows)
          assert all(r.get('disc_win_base_rate') is not None for r in rows)
          print('Base Rate 5Y OK',len(rows),rows[0]['end_of_month'],rows[-1]['end_of_month'])
          PY
      - name: Commit Base Rate snapshot
        run: |
          git add data_snapshots/hkma_base_rate_monthly.json
          if git diff --cached --quiet; then
            echo "Base Rate snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh five-year HKMA Base Rate history"
          git pull --rebase origin main
          git push origin main
