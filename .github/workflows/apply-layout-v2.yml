name: Apply dashboard layout v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_layout_v2.py'
      - '.github/workflows/apply-layout-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout patch
        run: python scripts/apply_layout_v2.py
      - name: Commit patched app.py
        run: |
          if git diff --quiet; then
            echo "No layout patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Refine dashboard navigation and layout"
          git push
