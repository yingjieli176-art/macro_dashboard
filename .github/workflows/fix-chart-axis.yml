name: fix-chart-axis
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch chart axes and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          new_xaxis = '''def _xaxis_config(date_range):
    cfg = {
        "5Y": {"freq": "QS", "dtick": "M3"},
        "1Y": {"freq": "MS", "dtick": "M1"},
        "6M": {"freq": "MS", "dtick": "M1"},
        "3M": {"freq": "7D", "dtick": "D7"},
        "1M": {"freq": "3D", "dtick": "D3"},
    }[date_range]
    return dict(
        showgrid=True,
        gridcolor="#eef2f7",
        griddash="dot",
        showline=True,
        linecolor="#9ca3af",
        linewidth=1,
        fixedrange=True,
        hoverformat="%Y-%m-%d",
        tickfont=dict(size=11),
        tickangle=0,
        ticklabelstandoff=6,
        automargin=False,
        **cfg,
    )
'''

          new_style = '''def apply_chart_style(fig, height, date_range):
    fig.update_layout(
        height=height,
        template="plotly_white",
        hovermode="x unified",
        dragmode=False,
        margin=dict(l=72, r=72, t=88, b=62),
        legend=dict(
            orientation="h",
            yanchor="bottom",
            y=1.10,
            xanchor="left",
            x=0,
            font=dict(size=10),
            traceorder="normal",
            itemwidth=70,
        ),
        hoverlabel=dict(bgcolor="white", font_size=11),
        font=dict(size=11 if compact_mode else 12),
        xaxis=_xaxis_config(date_range),
        xaxis2=dict(
            overlaying="x",
            anchor="y",
            side="top",
            showgrid=False,
            showline=False,
            ticks="",
            fixedrange=True,
            tickfont=dict(size=11),
            tickangle=0,
            automargin=False,
        ),
        yaxis=dict(
            showgrid=True,
            gridcolor="#e5e7eb",
            griddash="dot",
            zeroline=False,
            showline=True,
            linecolor="#9ca3af",
            linewidth=1,
            fixedrange=True,
            tickfont=dict(size=11),
            automargin=False,
            nticks=8,
        ),
        plot_bgcolor="#ffffff",
        paper_bgcolor="#ffffff",
    )

    # Bottom axis: numeric month/day only. Top axis: independent year labels.
    dates = []
    for trace in fig.data:
        if trace.x is not None:
            dates.extend(list(trace.x))
    parsed = pd.to_datetime(dates, errors="coerce")
    parsed = pd.Series(parsed).dropna().sort_values().drop_duplicates()
    if not parsed.empty:
        start = parsed.iloc[0]
        end = parsed.iloc[-1]
        freq = {"5Y": "QS", "1Y": "MS", "6M": "MS", "3M": "7D", "1M": "3D"}[date_range]
        ticks = pd.date_range(start=start.normalize(), end=end.normalize(), freq=freq)
        if len(ticks) == 0 or ticks[-1] < end.normalize():
            ticks = ticks.append(pd.DatetimeIndex([end.normalize()]))
        ticks = ticks[(ticks >= start.normalize()) & (ticks <= end.normalize())]
        fig.update_layout(xaxis=dict(
            **_xaxis_config(date_range),
            tickmode="array",
            tickvals=ticks,
            ticktext=[v.strftime("%m/%d") for v in ticks],
        ))

        year_vals = []
        year_text = []
        for year in sorted(parsed.dt.year.unique().tolist()):
            year_dates = parsed[parsed.dt.year == year]
            y0, y1 = year_dates.iloc[0], year_dates.iloc[-1]
            midpoint = y0 + (y1 - y0) / 2
            year_vals.append(midpoint)
            year_text.append(str(year))
        fig.update_layout(xaxis2=dict(
            overlaying="x",
            anchor="y",
            side="top",
            tickmode="array",
            tickvals=year_vals,
            ticktext=year_text,
            showgrid=False,
            showline=False,
            ticks="",
            fixedrange=True,
            tickfont=dict(size=11),
            tickangle=0,
            automargin=False,
        ))

    fig.update_xaxes(fixedrange=True)
    fig.update_yaxes(fixedrange=True)
    return fig
'''

          text, n1 = re.subn(r'def _xaxis_config\(date_range\):.*?(?=def apply_chart_style)', new_xaxis, text, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit('failed to locate _xaxis_config')
          text, n2 = re.subn(r'def apply_chart_style\(fig, height, date_range\):.*?(?=def get_start_date)', new_style, text, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit('failed to locate apply_chart_style')

          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-chart-axis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/fix-chart-axis.yml
          git commit -m "Fix chart date and year axes" || exit 0
          git push
