name: Remove broken watchlist refresh

on:
  push:
    paths:
      - 'requirements.txt'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove refresh feature and repair market block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n    refresh_col, _, _ = st\.columns\(\[1\.2, 3\.8, 1\]\)\n    with refresh_col:.*?(?=\n    [A-Za-z_].*?\(|\n    [A-Za-z_]+ =)', '', s, count=1, flags=re.S)
          s = s.replace('\n.module-refresh button { min-height: 28px !important; height: 28px !important; padding: 0 8px !important; font-size: 0.72rem !important; }', '')
          s = re.sub(r'\n\ndef _watchlist_quote_refresh_key\(\):.*?(?=\n@st\.cache_data|\ndef _quote_meta)', '', s, count=1, flags=re.S)
          s = re.sub(r'\n\ndef _refresh_quote_cache\(\):.*?(?=\n@st\.fragment)', '', s, count=1, flags=re.S)
          s = re.sub(r'\n    quotes = snapshot.*?\n    groups =', '\n    quotes = snapshot\n    groups =', s, count=1, flags=re.S)
          if '.news-content {' in s and '.news-content { font-family:' not in s:
              s = s.replace('.news-content { flex: 1; min-width: 0; }', '.news-content { flex: 1; min-width: 0; font-family: Arial, "Segoe UI", sans-serif; }')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile app.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Remove broken watchlist refresh feature' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/remove-watchlist-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/remove-watchlist-refresh.yml
          git commit -m 'Remove temporary repair workflow' || exit 0
          git push
