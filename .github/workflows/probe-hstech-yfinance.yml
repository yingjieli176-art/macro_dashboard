name: Probe HSTECH yfinance history

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-hstech-yfinance.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yfinance
        run: pip install yfinance pandas
      - name: Fetch HSTECH five-year history
        run: |
          python - <<'PY'
          import yfinance as yf
          import pandas as pd
          for ticker in ["HSTECH.HK", "^HSTECH"]:
              try:
                  df = yf.download(ticker, period="5y", interval="1d", auto_adjust=False, progress=False, threads=False)
                  print(ticker, "rows", len(df), "start", None if df.empty else df.index.min(), "end", None if df.empty else df.index.max())
                  if not df.empty:
                      monthly = df.resample("MS").last().dropna(how="all")
                      print(ticker, "monthly", len(monthly), monthly.tail(3).to_string())
                      if len(monthly) >= 48:
                          raise SystemExit(0)
              except Exception as exc:
                  print(ticker, "ERR", repr(exc))
          raise SystemExit("no complete HSTECH five-year history")
          PY
